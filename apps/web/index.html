<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="description" content="小国执政官 —— 一款数值模拟版的轻量化执政模拟游戏" />
  <title>小国执政官 · 执政模拟</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">📜 小国执政官 <span class="version">v0.2</span></div>
    <div class="hud">
      <span class="hud-item" title="年份">📅 第 <b id="hud-year">1</b> 年</span>
      <span class="hud-item" title="人口">👥 <b id="hud-pop">0</b></span>
      <span class="hud-item" title="国库（粮食）">💰 <b id="hud-treasury">0</b></span>
      <span class="hud-item" title="平均满意度">😊 <b id="hud-sat">0</b></span>
      <span class="hud-item" title="平均智力">🧠 <b id="hud-int">0</b></span>
      <span class="hud-item warn" title="罪犯">💀 <b id="hud-crim">0</b></span>
    </div>
    <div class="actions">
      <button id="btn-save" class="btn btn-ghost">💾 存档</button>
      <button id="btn-load" class="btn btn-ghost">📂 读档</button>
      <button id="btn-restart" class="btn btn-ghost">🔄 重开</button>
    </div>
  </header>

  <main class="layout">
    <!-- 左：政策面板 -->
    <aside class="panel panel-policy">
      <h2>政策调控</h2>
      <p id="policy-window-tip" class="policy-window-tip">政策窗口开放：本年可调整税率、公务员与军费</p>

      <section class="policy-presets" aria-label="快捷政策方案">
        <div class="preset-title">快捷方案</div>
        <div class="preset-buttons">
          <button class="btn policy-preset" data-preset="wellbeing" title="低税、低军费，优先民生与教育">休养生息 · 低税民生</button>
          <button class="btn policy-preset" data-preset="balanced" title="中等税率，兼顾治安、民生与教育">均衡治理 · 稳健发展</button>
          <button class="btn policy-preset" data-preset="defense" title="较高税率和军费，优先军事与治安">富国强兵 · 高税军务</button>
        </div>
        <div id="official-capacity" class="official-capacity"></div>
      </section>

      <details class="advanced-policy">
        <summary>高级调控：逐项细调</summary>

      <fieldset>
        <legend>税率</legend>
        <div id="tax-adjust-tip" class="role-help-text"></div>
        <label>农民 <output id="out-tax-farmer">5%</output>
          <input type="range" id="tax-farmer" min="0" max="50" step="1" value="5" />
        </label>
        <label>工人 <output id="out-tax-worker">8%</output>
          <input type="range" id="tax-worker" min="0" max="50" step="1" value="8" />
        </label>
        <label>商人 <output id="out-tax-merchant">10%</output>
          <input type="range" id="tax-merchant" min="0" max="50" step="1" value="10" />
        </label>
      </fieldset>

      <fieldset>
        <legend>公务员配额</legend>
        <label>人均年工资 <output id="out-official-wage">10 / 人</output>
          <span class="role-help-text">实际支出 = 在职公务员人数 × 工资；原策划案参考值 60</span>
          <input type="range" id="official-wage" min="0" max="100" step="1" value="10" />
        </label>
        <label>税务 <button class="help-btn role-help-btn" type="button" data-help="help-tax">?</button><output id="out-off-tax">1</output>
          <span id="help-tax" class="role-help-text hidden">每人管辖 100 名纳税人｜开局解锁</span>
          <input type="range" id="off-tax" min="0" max="20" step="1" value="1" />
        </label>
        <label>治安 <button class="help-btn role-help-btn" type="button" data-help="help-security">?</button><output id="out-off-security">1</output>
          <span id="help-security" class="role-help-text hidden">按人数消除罪犯｜第 5 年解锁</span>
          <input type="range" id="off-security" min="0" max="20" step="1" value="1" />
        </label>
        <label>民生 <button class="help-btn role-help-btn" type="button" data-help="help-welfare">?</button><output id="out-off-welfare">0</output>
          <span id="help-welfare" class="role-help-text hidden">人口过百后缩短调税间隔｜第 11 年解锁</span>
          <input type="range" id="off-welfare" min="0" max="20" step="1" value="0" />
        </label>
        <label>军事 <button class="help-btn role-help-btn" type="button" data-help="help-military">?</button><output id="out-off-military">0</output>
          <span id="help-military" class="role-help-text hidden">提升战争战力｜第 21 年解锁</span>
          <input type="range" id="off-military" min="0" max="20" step="1" value="0" />
        </label>
        <label>教师 <button class="help-btn role-help-btn" type="button" data-help="help-teacher">?</button><output id="out-off-teacher">2</output>
          <span id="help-teacher" class="role-help-text hidden">每人教育 10 人｜开局解锁</span>
          <input type="range" id="off-teacher" min="0" max="20" step="1" value="2" />
        </label>
      </fieldset>

      <fieldset>
        <legend>军费</legend>
        <label>国库占比 <output id="out-mil">5%</output>
          <input type="range" id="mil-ratio" min="0" max="50" step="1" value="5" />
        </label>
      </fieldset>
      </details>
    </aside>

    <!-- 中：可视化 -->
    <section class="panel panel-vis">
      <div class="charts">
        <div class="chart-box">
          <h3>阶级人口</h3>
          <canvas id="chart-class" width="280" height="220"></canvas>
        </div>
        <div class="chart-box">
          <h3>历史曲线</h3>
          <canvas id="chart-history" width="540" height="220"></canvas>
          <div class="legend">
            <span class="lg lg-pop">蓝线：人口规模</span>
            <span class="lg lg-sat">绿线：平均满意度</span>
            <span class="lg lg-tre">金线：国库储备</span>
          </div>
        </div>
      </div>

      <div class="footer-bar">
        <button id="btn-next" class="btn btn-primary">⏯ 下一年</button>
        <button id="btn-fast" class="btn">⏩ 推进至决策</button>
        <span id="chapter-tip" class="chapter-tip"></span>
      </div>
      <div id="year-summary" class="year-summary">推进一年后显示年度变化</div>

      <section class="people-board">
        <div class="people-head">
          <h3>国民个体</h3>
          <span>点击头像查看阶级与满意度变化</span>
        </div>
        <div class="people-content">
          <div id="people-grid" class="people-grid"></div>
          <aside id="person-detail" class="person-detail">
            <div class="detail-empty">选择一位国民查看履历</div>
          </aside>
        </div>
      </section>
    </section>

    <!-- 右：日志/事件 -->
    <aside class="panel panel-log">
      <h2>朝堂日志</h2>
      <div id="log-list" class="log-list"></div>
    </aside>
  </main>

  <!-- 事件弹窗 -->
  <div id="event-modal" class="modal hidden">
    <div class="modal-card">
      <h3 id="event-title">事件</h3>
      <p id="event-desc" class="event-desc"></p>
      <div id="event-options" class="event-options"></div>
    </div>
  </div>

  <div id="war-modal" class="modal hidden">
    <div class="modal-card war-card">
      <h3 id="war-title">⚔ 战争危机</h3>
      <p id="war-desc" class="event-desc"></p>
      <div class="war-grid">
        <label>征兵规模<select id="war-conscription"><option value="0.05">试探 5%</option><option value="0.1">适度 10%</option><option value="0.2" selected>标准 20%</option><option value="0.3">大规模 30%</option><option value="0.4">全面 40%</option><option value="0.5">倾国 50%</option></select></label>
        <label>军队补给<select id="war-supply"><option value="1">基本</option><option value="2" selected>充足</option><option value="3">奢足</option></select></label>
        <label>装备水平<select id="war-equipment"><option value="1">简陋</option><option value="2" selected>标准</option><option value="3">精良</option></select></label>
      </div>
      <div id="war-estimate" class="war-estimate"></div>
      <div id="war-treaty" class="war-treaty"></div>
      <div class="event-options">
        <button id="war-fight" class="btn btn-primary">出兵作战</button>
        <button id="war-sign" class="btn">签订条约</button>
        <button id="war-surrender" class="btn">直接投降赔款</button>
      </div>
    </div>
  </div>

  <!-- 结算弹窗 -->
  <div id="end-modal" class="modal hidden">
    <div class="modal-card">
      <h3 id="end-title"></h3>
      <p id="end-desc"></p>
      <button id="end-restart" class="btn btn-primary">再来一局</button>
    </div>
  </div>

  <!-- 引导提示 -->
  <div id="tutorial" class="tutorial hidden">
    <span id="tutorial-text"></span>
    <button id="tutorial-next" class="btn btn-ghost">知道了</button>
  </div>

  <script type="module" src="./scripts/main.js"></script>
</body>
</html>
