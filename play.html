<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小国执政官 - 本地单文件版</title>
  <style>
    :root{--bg:#f5efe3;--paper:#fffaf0;--ink:#263645;--soft:#667584;--red:#b84032;--green:#2f9d63;--blue:#2f80c9;--gold:#c49321;--purple:#7d4ca0;--line:#dfd3bd}
    *{box-sizing:border-box} body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
    header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
    h1{font-size:20px;margin:0;color:var(--red)} .hud{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.hud b{font-size:15px}.warn b{color:var(--red)}
    main{display:grid;grid-template-columns:280px 1fr 300px;gap:12px;padding:12px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;box-shadow:0 2px 8px #0001}
    h2{font-size:16px;margin:0 0 10px;color:var(--red)} fieldset{border:1px solid var(--line);border-radius:6px;margin:0 0 10px;padding:8px 10px} legend{color:var(--red);font-size:12px}
    label{display:block;font-size:13px;color:var(--soft);margin:8px 0} output{float:right;color:var(--ink);font-weight:700} input[type=range]{width:100%;accent-color:var(--red)}
    button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:8px 14px;cursor:pointer}button:hover{background:white}.primary{background:var(--red);border-color:var(--red);color:white;font-weight:700}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.charts{display:grid;grid-template-columns:300px 1fr;gap:10px}.chart{border:1px solid var(--line);border-radius:6px;background:white;padding:8px}
    canvas{max-width:100%;height:auto}.log{font-size:13px;line-height:1.7;max-height:70vh;overflow:auto}.year{color:var(--red);font-weight:700;margin-top:8px}.line{border-left:2px solid var(--line);padding-left:8px;color:var(--soft)}
    .people{margin-top:12px;border:1px solid var(--line);border-radius:8px;background:#fffdf7;padding:10px}.people-head{display:flex;justify-content:space-between;color:var(--soft);font-size:12px}.people-body{display:grid;grid-template-columns:1fr 240px;gap:10px;margin-top:8px}.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;max-height:260px;overflow:auto}.avatar{padding:6px 4px;min-height:66px;display:flex;flex-direction:column;align-items:center;gap:3px}.avatar.active{border-color:var(--red);box-shadow:0 2px 8px #0001}.face{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:700}.aname{font-size:11px;max-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.asat{font-size:10px;color:var(--soft)}.detail{border-left:1px dashed var(--line);padding-left:10px;color:var(--soft);font-size:12px;max-height:260px;overflow:auto}.dtitle{font-size:15px;color:var(--ink);font-weight:700;margin-bottom:8px}.drow{display:flex;justify-content:space-between;border-bottom:1px solid #eee4d2;padding:4px 0}.histrow{display:grid;grid-template-columns:42px 1fr 64px;gap:6px;border-bottom:1px dashed #eee4d2;padding:3px 0}
    .modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:5}.hidden{display:none}.box{width:min(460px,92vw);background:var(--paper);border-top:4px solid var(--red);border-radius:8px;padding:22px;box-shadow:0 12px 36px #0005}.box p{color:var(--soft);line-height:1.7}.opts{display:grid;gap:8px}.opts button{text-align:left}
    .help{width:20px;height:20px;padding:0;border-radius:50%;color:var(--red);font-weight:700}.official-help{display:block;font-size:11px;line-height:1.5;color:var(--soft);background:#f6efe2;padding:6px;border-radius:4px;margin:4px 0}.official-help.hidden{display:none}.truncated{grid-column:1/-1;text-align:center;color:var(--soft);font-size:11px}
    .wargrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wargrid select{width:100%;padding:6px}.warinfo{padding:8px;margin:8px 0;background:#f6efe2;color:var(--soft);font-size:12px;line-height:1.5;border-radius:4px}
    .presetbox{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:10px;background:#fffdf7}.presetbox b{display:block;color:var(--red);font-size:12px;margin-bottom:6px}.presetgrid{display:grid;gap:6px}.presetgrid button{text-align:left}.capacity,.year-delta{font-size:11px;color:var(--soft);margin-top:7px}.capacity.over{color:var(--red);font-weight:700}details summary{cursor:pointer;color:var(--soft);font-size:12px;margin:8px 0}.year-delta{padding:5px 9px;background:#f6efe2;border-radius:12px}
    @media(max-width:920px){main{grid-template-columns:1fr}.charts,.people-body{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.detail{border-left:0;border-top:1px dashed var(--line);padding-left:0;padding-top:8px}}
  </style>
</head>
<body>
  <header>
    <h1>小国执政官 <small>本地版 v0.2</small></h1>
    <div class="hud">
      <span>第 <b id="year">1</b> 年</span><span>人口 <b id="pop">0</b></span><span>国库 <b id="tre">0</b></span>
      <span>满意 <b id="sat">0</b></span><span>智力 <b id="intel">0</b></span><span class="warn">罪犯 <b id="crim">0</b></span>
    </div>
    <div class="controls"><button id="save">存档</button><button id="load">读档</button><button id="reset">重开</button></div>
  </header>
  <main>
    <section class="panel">
      <h2>政策调控</h2>
      <div class="presetbox"><b>快捷方案</b><div id="presetTip" class="capacity"></div><div class="presetgrid"><button class="preset" data-preset="wellbeing">休养生息 · 低税重民生</button><button class="preset" data-preset="balanced">均衡治理 · 各方兼顾</button><button class="preset" data-preset="defense">富国强兵 · 高税重军务</button></div><div id="capacity" class="capacity"></div></div>
      <details><summary>高级调控：逐项细调</summary>
      <fieldset><legend>税率</legend>
        <div id="taxTip" class="official-help"></div>
        <label>农民 <output id="o-tf">5%</output><input id="tf" type="range" min="0" max="50" value="5"></label>
        <label>工人 <output id="o-tw">8%</output><input id="tw" type="range" min="0" max="50" value="8"></label>
        <label>商人 <output id="o-tm">10%</output><input id="tm" type="range" min="0" max="50" value="10"></label>
      </fieldset>
      <fieldset><legend>公务员</legend>
        <label>人均年工资 <output id="o-wg">10 / 人</output><span class="official-help">实际支出 = 在职公务员人数 × 工资；原策划案参考值60</span><input id="wg" type="range" min="0" max="100" value="10"></label>
        <label>税务 <button class="help roleHelp" data-help="rhTax" type="button">?</button><output id="o-ot">1</output><span id="rhTax" class="official-help hidden">每人管辖100名纳税人｜开局解锁</span><input id="ot" type="range" min="0" max="20" value="1"></label>
        <label>治安 <button class="help roleHelp" data-help="rhSec" type="button">?</button><output id="o-os">1</output><span id="rhSec" class="official-help hidden">按人数消除罪犯｜第5年解锁</span><input id="os" type="range" min="0" max="20" value="1"></label>
        <label>民生 <button class="help roleHelp" data-help="rhWel" type="button">?</button><output id="o-ow">0</output><span id="rhWel" class="official-help hidden">人口过百后缩短调税间隔｜第11年解锁</span><input id="ow" type="range" min="0" max="20" value="0"></label>
        <label>军事 <button class="help roleHelp" data-help="rhMil" type="button">?</button><output id="o-om">0</output><span id="rhMil" class="official-help hidden">提升战争战力｜第21年解锁</span><input id="om" type="range" min="0" max="20" value="0"></label>
        <label>教师 <button class="help roleHelp" data-help="rhTea" type="button">?</button><output id="o-oe">2</output><span id="rhTea" class="official-help hidden">每人教育10人｜开局解锁</span><input id="oe" type="range" min="0" max="20" value="2"></label>
      </fieldset>
      <fieldset><legend>军费</legend><label>国库占比 <output id="o-mil">5%</output><input id="mil" type="range" min="0" max="50" value="5"></label></fieldset>
      </details>
    </section>
    <section class="panel">
      <h2>国家概览</h2>
      <div class="charts"><div class="chart"><canvas id="pie" width="280" height="220"></canvas></div><div class="chart"><canvas id="hist" width="560" height="220"></canvas></div></div>
      <div class="controls"><button id="next" class="primary">下一年</button><button id="fast">推进至决策</button><span id="tip">目标：撑过 30 年后进入持续经营。政策每 3 年开放一次。</span></div><div id="yearDelta" class="year-delta">推进一年后显示年度变化</div>
      <div class="people"><div class="people-head"><b>国民个体</b><span>点击头像查看阶级与满意度变化</span></div><div class="people-body"><div id="peopleGrid" class="people-grid"></div><div id="personDetail" class="detail">选择一位国民查看履历</div></div></div>
    </section>
    <section class="panel"><h2>朝堂日志</h2><div id="log" class="log"></div></section>
  </main>
  <div id="eventModal" class="modal hidden"><div class="box"><h2 id="et"></h2><p id="ed"></p><div id="eo" class="opts"></div></div></div>
  <div id="warModal" class="modal hidden"><div class="box"><h2 id="warTitle"></h2><p id="warDesc"></p><div class="wargrid"><label>征兵<select id="warRate"><option value=".05">5%</option><option value=".1">10%</option><option value=".2" selected>20%</option><option value=".3">30%</option><option value=".4">40%</option><option value=".5">50%</option></select></label><label>补给<select id="warSupply"><option value="1">基本</option><option value="2" selected>充足</option><option value="3">奢足</option></select></label><label>装备<select id="warEquip"><option value="1">简陋</option><option value="2" selected>标准</option><option value="3">精良</option></select></label></div><div id="warEstimate" class="warinfo"></div><div id="warTreaty" class="warinfo"></div><div class="opts"><button id="warFight" class="primary">出兵作战</button><button id="warSign">签订条约</button><button id="warSurrender">直接投降赔款</button></div></div></div>
  <div id="end" class="modal hidden"><div class="box"><h2 id="endt"></h2><p id="endd"></p><button id="again" class="primary">再来一局</button></div></div>
  <script>
    const C={grainNeed:10,grainReserveNeed:20,productNeedBase:1,productReserveNeed:3,rebelThreshold:-10,inflatedThreshold:24,lowCrimeChance:.12,highCrimeChance:.03,crimeStartYear:6,farmerProdMean:180,farmerProdJitter:18,workerProdMean:30,workerProdJitter:1.5,productionCost:1.5,govWage:10,birthAgeMin:18,birthAgeMax:40,birthRateFarmer:.22,birthRateWorker:.18,birthRateMerchant:.14,populationSoftCap:800,populationHardCap:2000,accidentDeathRate:.01,starvationDeathRate:.08,deathStartAge:50,deathHardCap:95,renderLimit:300};
    const cls=['farmer','worker','merchant','official'], colors={farmer:'#2f9d63',worker:'#2f80c9',merchant:'#c49321',official:'#7d4ca0'}, names={farmer:'农民',worker:'工人',merchant:'商人',official:'公务员'};
    class RNG{constructor(seed=Date.now()){this.s=(seed>>>0)||1}next(){let x=this.s;x^=x<<13;x^=x>>>17;x^=x<<5;this.s=x>>>0;return this.s/4294967295}u(a,b){return a+(b-a)*this.next()}i(a,b){return Math.floor(this.u(a,b+1))}n(m,s){let u=0,v=0;while(!u)u=this.next();while(!v)v=this.next();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}c(p){return this.next()<p}}
    const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)); const compact=n=>{n=Number(n)||0;let a=Math.abs(n);if(a>=1e6)return(n/1e6).toFixed(a>=1e7?0:1)+'M';if(a>=1e4)return(n/1e4).toFixed(a>=1e5?0:1)+'万';if(a>=1e3)return(n/1e3).toFixed(a>=1e4?0:1)+'K';return String(Math.round(n))}; let uid=0,state,selectedId=null,chartView={start:null,end:null,hover:null};const surn='赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦尤许何吕施张孔曹严华金魏陶姜戚谢邹喻柏水窦章云苏潘葛范彭郎鲁韦昌马苗凤花方俞任袁柳鲍史唐费廉岑薛雷贺倪汤'.split(''),given='安邦承德明远知礼怀仁景行守正敬文思齐修远仲平子谦伯宁元直文昌德厚清和嘉言有恒'.match(/.{1,2}/g);const pname=r=>surn[r.i(0,surn.length-1)]+given[r.i(0,given.length-1)];
    function person(r,k,age){return{id:++uid,name:pname(r),klass:k,age:age??r.i(18,40),gender:r.c(.5)?'male':'female',intelligence:Math.round(clamp(r.n(50,15),0,100)),satisfaction:12,grain:42,product:6,isCriminal:false,isInflated:false,role:null,history:[]}}
    function rec(){for(const p of state.people){if(!p.history)p.history=[];let e={year:state.year,klass:p.klass,satisfaction:+p.satisfaction.toFixed(2)},l=p.history[p.history.length-1];if(!l||l.year!==state.year)p.history.push(e);else Object.assign(l,e);if(p.history.length>120)p.history.shift()}}
    function newGame(){let rng=new RNG(Date.now()),people=[];for(const [k,n] of Object.entries({farmer:18,worker:6,merchant:2,official:4}))for(let i=0;i<n;i++)people.push(person(rng,k));state={year:1,rng,people,treasury:1000,morality:0,rationality:0,policy:{tax:{farmer:.05,worker:.08,merchant:.10},officialWage:C.govWage,militaryRatio:.05,officials:{tax:1,security:1,welfare:0,military:0,teacher:2}},history:[],log:['【立国】游戏开始，初始人口 '+people.length],pendingEvent:null,pendingWar:null,treaty:null,lastWarYear:null,warHistory:[],over:null,bad:0,crime:0,low:0,flags:{},storyHooks:[],lastTaxChangeYear:null,lastYearChanges:null,recentEventIds:[]};stat();rec();selectedId=people[0]?.id}
    function stat(){let s={total:state.people.length,byClass:{farmer:0,worker:0,merchant:0,official:0},avgSatisfaction:0,avgIntelligence:0,avgWealth:0,criminals:0,classWealth:{farmer:0,worker:0,merchant:0,official:0},classSat:{farmer:0,worker:0,merchant:0,official:0},classCount:{farmer:0,worker:0,merchant:0,official:0}},satCount=0,classSatCount={farmer:0,worker:0,merchant:0,official:0};for(const p of state.people){s.byClass[p.klass]++;if(!p.isCriminal){s.avgSatisfaction+=p.satisfaction;satCount++;s.classSat[p.klass]+=p.satisfaction;classSatCount[p.klass]++}s.avgIntelligence+=p.intelligence;let w=p.grain+p.product*2;s.avgWealth+=w;s.classWealth[p.klass]+=w;s.classCount[p.klass]++;if(p.isCriminal)s.criminals++}if(s.total){s.avgSatisfaction=satCount?+(s.avgSatisfaction/satCount).toFixed(2):0;s.avgIntelligence=+(s.avgIntelligence/s.total).toFixed(2);s.avgWealth=+(s.avgWealth/s.total).toFixed(2);for(const k of cls)if(s.classCount[k]){s.classWealth[k]=+(s.classWealth[k]/s.classCount[k]).toFixed(2);s.classSat[k]=classSatCount[k]?+(s.classSat[k]/classSatCount[k]).toFixed(2):0}}state.stats=s}
    function mods(log){let farm=clamp(state.rng.n(1,.08),.82,1.18),work=clamp(state.rng.n(1,.05),.88,1.12),price=clamp(state.rng.n(1,.04),.9,1.1),birth=state.rng.u(-.015,.015); if(farm>1.08)log.push('雨水充沛，农产略增'); else if(farm<.92)log.push('天气欠佳，农产略减'); if(price>1.05)log.push('市价微涨，交易成本提高'); else if(price<.95)log.push('市价平稳偏低，交易更顺畅'); return{farm,work,price,birth}}
    function nextYear(){if(state.over||state.pendingEvent||state.pendingWar)return;let before={population:state.stats.total,treasury:state.treasury,avgSatisfaction:state.stats.avgSatisfaction,criminals:state.stats.criminals},log=['━━ 第 '+state.year+' 年 ━━'],m=mods(log);enforceTreaty(log);state.people.filter(p=>p.klass==='official').forEach(p=>p.role=null);let offs=state.people.filter(p=>p.klass==='official'&&!p.isCriminal),roles=state.policy.officials,j=0;for(const r of Object.keys(roles)){let unlocked=r!=='security'||state.year>=5,welfareUnlocked=r!=='welfare'||state.year>=11,militaryUnlocked=r!=='military'||state.year>=21,count=unlocked&&welfareUnlocked&&militaryUnlocked?roles[r]:0;for(let n=0;n<count&&j<offs.length;n++,j++)offs[j].role=r}for(;j<offs.length;j++)offs[j].role='governor';
      for(const p of state.people){if(p.isCriminal)continue; if(p.klass==='farmer'){let out=(C.farmerProdMean/10+C.farmerProdJitter*(clamp(p.intelligence,10,100)-50)/100+state.rng.u(-1,1))*m.farm;p.grain+=Math.max(C.grainNeed*13,out)} if(p.klass==='worker'){let raw=(C.workerProdMean/5+C.workerProdJitter*(clamp(p.intelligence,10,100)-50)/100+state.rng.u(-.5,.5))*m.work,out=Math.max(C.productNeedBase*13,raw);p.product+=out;p.grain-=C.productionCost*out/5}}
      trade(log,m.price);tax(log);wages(log);educate(log);for(const p of state.people){p.grain-=C.grainNeed;p.product=Math.max(0,p.product-C.productNeedBase)}stat();satisfy();crime(log);birth(log,m.birth);death(log);mobility(log);stat();state.lastYearChanges={year:state.year,population:state.stats.total-before.population,treasury:Math.round(state.treasury-before.treasury),avgSatisfaction:+(state.stats.avgSatisfaction-before.avgSatisfaction).toFixed(2),criminals:state.stats.criminals-before.criminals};rec();state.history.push({year:state.year,population:state.stats.total,treasury:Math.round(state.treasury),avgSatisfaction:state.stats.avgSatisfaction});outcome();if(!state.over){maybeWar();if(!state.pendingWar)state.pendingEvent=rollEvent()}state.log=log;state.year++;render()}

    function outcome(){if(!state.stats.total){state.over='lose:人口归零';return} if(state.treasury<0){if(++state.bad>=3){state.over='lose:国库连续 3 年破产';return}}else state.bad=0; if(state.stats.criminals/state.stats.total>.45){if(++state.crime>=2){state.over='lose:革命爆发';return}}else state.crime=0; if(state.stats.avgSatisfaction<-24){if(++state.low>=5){state.over='lose:民心尽失';return}}else state.low=0; if(!state.goalMet&&state.year>=30&&state.stats.total>=20&&state.stats.avgSatisfaction>=-15){state.goalMet=true;state.log.push('章节目标达成：立国。国家进入持续经营阶段。')}}
    function signed(value,digits=0){let n=Number(value)||0,text=digits?n.toFixed(digits):String(Math.round(n));return n>0?'+'+text:text}function summaryText(c){return c?'第 '+c.year+' 年变化　人口 '+signed(c.population)+'　国库 '+signed(c.treasury)+'　满意 '+signed(c.avgSatisfaction,2)+'　罪犯 '+signed(c.criminals):'推进一年后显示年度变化'}
    function syncPolicyControls(){let values={tf:Math.round(state.policy.tax.farmer*100),tw:Math.round(state.policy.tax.worker*100),tm:Math.round(state.policy.tax.merchant*100),wg:state.policy.officialWage,ot:state.policy.officials.tax,os:state.policy.officials.security,ow:state.policy.officials.welfare,om:state.policy.officials.military,oe:state.policy.officials.teacher,mil:Math.round(state.policy.militaryRatio*100)};for(const [id,value] of Object.entries(values)){let el=document.getElementById(id),out=document.getElementById('o-'+id);el.value=value;out.textContent=['tf','tw','tm','mil'].includes(id)?value+'%':id==='wg'?value+' / 人':value}let available=state.people.filter(p=>p.klass==='official'&&!p.isCriminal).length,roles=state.policy.officials,active=Object.values(roles).reduce((sum,count)=>sum+count,0);capacity.textContent='计划配额 '+active+' / 可用公务员 '+available;capacity.classList.toggle('over',active>available)}
    function render(){stat();year.textContent=state.year;pop.textContent=state.stats.total;tre.textContent=compact(state.treasury);tre.title=Math.round(state.treasury);sat.textContent=state.stats.avgSatisfaction;intel.textContent=state.stats.avgIntelligence;crim.textContent=state.stats.criminals;yearDelta.textContent=summaryText(state.lastYearChanges);drawPie();drawHist();renderPeople();syncPolicyControls();updatePolicyLock();let key=state.log[0]||'year-'+state.year,html=state.log.map((x,i)=>i?'<div class=line>'+x+'</div>':'<div class=year>'+x+'</div>').join(''),first=log.firstElementChild;if(first?.dataset.logKey===key)first.innerHTML=html;else{let d=document.createElement('div');d.dataset.logKey=key;d.innerHTML=html;log.prepend(d)}while(log.children.length>30)log.removeChild(log.lastChild);if(state.pendingEvent)showEvent();else document.getElementById('eventModal').classList.add('hidden');if(state.pendingWar)showWar();else warModal.classList.add('hidden');if(state.over){endt.textContent='游戏结束';endd.textContent='原因：'+state.over.replace('lose:','');end.classList.remove('hidden')}}
    function showEvent(){let e=state.pendingEvent;et.textContent=e[1];ed.textContent=e[2];eo.innerHTML='';e[3].forEach((o,i)=>{let b=document.createElement('button');b.textContent=o[0];b.onclick=()=>{state.log.push('事件【'+e[1]+'】→ '+o[0]);o[1](state);let h=o[2]||{},m=Number(h.morality),r=Number(h.rationality);state.morality=(Number.isFinite(state.morality)?state.morality:0)+(Number.isFinite(m)?m:0);state.rationality=(Number.isFinite(state.rationality)?state.rationality:0)+(Number.isFinite(r)?r:0);state.pendingEvent=null;document.getElementById('eventModal').classList.add('hidden');render()};eo.appendChild(b)});document.getElementById('eventModal').classList.remove('hidden')}
    function drawPie(){let c=pie.getContext('2d'),W=pie.width,H=pie.height;c.clearRect(0,0,W,H);let total=state.stats.total,start=-Math.PI/2;for(const k of cls){let v=state.stats.byClass[k];if(!v)continue;let a=v/total*Math.PI*2;c.beginPath();c.moveTo(W/2,H/2-10);c.arc(W/2,H/2-10,75,start,start+a);c.fillStyle=colors[k];c.fill();start+=a}let x=14,y=185;c.font='12px sans-serif';for(const k of cls){c.fillStyle=colors[k];c.fillRect(x,y,10,10);c.fillStyle='#333';c.fillText(names[k]+' '+state.stats.byClass[k],x+14,y+10);x+=68}}
    function renderPeople(){if(!state.people.some(p=>p.id===selectedId))selectedId=state.people[0]?.id;let visible=state.people.slice(0,C.renderLimit);peopleGrid.innerHTML=visible.map(p=>'<button class="avatar '+(p.id===selectedId?'active':'')+'" data-id="'+p.id+'"><span class="face" style="background:'+colors[p.klass]+'">'+(p.name||'民').slice(0,1)+'</span><span class="aname">'+(p.name||('无名'+p.id))+'</span><span class="asat">满意 '+p.satisfaction.toFixed(1)+'</span></button>').join('')+(state.people.length>C.renderLimit?'<div class="truncated">为保持流畅，仅显示前 '+C.renderLimit+' / '+state.people.length+' 人</div>':'');peopleGrid.querySelectorAll('.avatar').forEach(b=>b.onclick=()=>{selectedId=+b.dataset.id;renderPeople()});let p=state.people.find(x=>x.id===selectedId);if(!p){personDetail.textContent='选择一位国民查看履历';return}let hs=(p.history||[]).slice(-12).reverse();personDetail.innerHTML='<div class="dtitle">'+p.name+'</div><div class="drow"><span>阶级</span><b>'+names[p.klass]+'</b></div><div class="drow"><span>年龄</span><b>'+p.age+'</b></div><div class="drow"><span>性别</span><b>'+(p.gender==='female'?'女':'男')+'</b></div><div class="drow"><span>满意度</span><b>'+p.satisfaction.toFixed(2)+'</b></div><div class="drow"><span>智力</span><b>'+p.intelligence.toFixed(2)+'</b></div><div class="drow"><span>粮食/产品</span><b>'+p.grain.toFixed(1)+' / '+p.product.toFixed(1)+'</b></div><div class="dtitle" style="margin-top:8px">变化记录</div>'+hs.map(h=>'<div class="histrow"><span>'+h.year+'年</span><span>'+names[h.klass]+'</span><b>'+Number(h.satisfaction).toFixed(2)+'</b></div>').join('')}
    function drawHist(){let c=hist.getContext('2d'),W=hist.width,H=hist.height,h=state.history;c.clearRect(0,0,W,H);if(h.length<2){c.strokeStyle='#e8e1d3';c.lineWidth=2;c.strokeRect(28,24,W-56,H-48);c.fillStyle='#b7b0a3';c.font='600 18px Microsoft YaHei, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('推进几年后显示人口、满意度、国库曲线',W/2,H/2);c.textAlign='left';c.textBaseline='alphabetic';return}let first=h[0].year,lastY=h[h.length-1].year;if(chartView.start==null){chartView.start=first;chartView.end=lastY}if(chartView.end===lastY-1)chartView.end=lastY;chartView.start=Math.max(first,Math.min(chartView.start,lastY-1));chartView.end=Math.min(lastY,Math.max(chartView.end,chartView.start+1));let pts=h.filter(p=>p.year>=chartView.start&&p.year<=chartView.end);if(pts.length<2)pts=h.slice(-2);let min=pts[0].year,max=pts[pts.length-1].year,xmap=y=>38+(y-min)/(max-min||1)*(W-54);c.strokeStyle='#ddd';c.strokeRect(38,32,W-54,H-66);function line(fn,col){let vs=pts.map(fn),lo=Math.min(...vs),hi=Math.max(...vs),r=hi-lo||1;c.beginPath();c.strokeStyle=col;c.lineWidth=2;pts.forEach((p,i)=>{let x=xmap(p.year),y=32+(H-66)-(vs[i]-lo)/r*(H-66);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}line(p=>p.population,colors.worker);line(p=>p.avgSatisfaction,colors.farmer);line(p=>p.treasury,colors.merchant);c.fillStyle='#8a8174';c.font='10px sans-serif';c.textAlign='center';for(let i=0;i<Math.min(6,Math.max(2,max-min+1));i++){let y=Math.round(min+(max-min)*i/(Math.min(6,Math.max(2,max-min+1))-1||1));c.fillText(y+'年',xmap(y),H-14)}c.textAlign='left';let last=pts[pts.length-1],x=38;c.font='11px sans-serif';for(const it of [{t:'人口 '+last.population,c:colors.worker},{t:'满意度 '+last.avgSatisfaction,c:colors.farmer},{t:'国库 '+compact(last.treasury),c:colors.merchant}]){c.strokeStyle=it.c;c.lineWidth=3;c.beginPath();c.moveTo(x,16);c.lineTo(x+18,16);c.stroke();c.fillStyle='#54667a';c.fillText(it.t,x+23,20);x+=118}if(chartView.hover!=null){let p=pts.reduce((a,b)=>Math.abs(b.year-chartView.hover)<Math     function policyOpen(){return !state.over&&!state.pendingEvent&&!state.pendingWar&&(state.year-1)%3===0}function securityOpen(){return !state.over&&!state.pendingEvent&&!state.pendingWar&&state.year>=5}function welfareOpen(){return policyOpen()&&state.year>=11}function militaryOpen(){return policyOpen()&&state.year>=21}function welfareCount(){return state.people.filter(p=>!p.isCriminal&&p.role==='welfare').length}function taxInterval(){let n=welfareCount();return n>10?1:Math.max(1,11-n)}function taxOpen(){if(state.over||state.pendingEvent||state.pendingWar)return false;if(state.people.length<=100)return policyOpen();if(!welfareCount())return false;if(state.lastTaxChangeYear==null||state.lastTaxChangeYear===state.year)return true;return state.year-state.lastTaxChangeYear>=taxInterval()}function setTax(k,v){if(!taxOpen())return;v=Math.max(v,state.treaty?.minTaxRate||0);if(state.policy.tax[k]===v)return;state.policy.tax[k]=v;state.lastTaxChangeYear=state.year}function updatePolicyLock(){let open=policyOpen(),left=3-((state.year-1)%3),floor=Math.round((state.treaty?.minTaxRate||0)*100);tip.textContent=open?'政策窗口开放：本年可调整公务员与军费':'政策已锁定，'+left+' 年后可再次调控；治安官第 5 年起可单独调整';presetTip.textContent=open?'政策窗口开放，可一键应用':'政策已锁定，'+left+' 年后开放';document.querySelectorAll('input[type=range]').forEach(el=>{if(['tf','tw','tm'].includes(el.id)){el.disabled=!taxOpen();el.min=floor}else if(el.id==='os')el.disabled=!securityOpen();else if(el.id==='ow')el.disabled=!welfareOpen();else if(el.id==='om')el.disabled=!militaryOpen();else el.disabled=!open});document.querySelectorAll('.preset').forEach(el=>el.disabled=!open);if(floor)taxTip.textContent='条约期内税率不得低于'+floor+'%';else if(state.people.length<=100)taxTip.textContent='人口不超过100：税率随常规政策窗口调整';else if(!welfareCount())taxTip.textContent='人口超过100且无民生官员：税率锁定';else if(taxOpen())taxTip.textContent=welfareCount()+'名民生官员：本年可调税（间隔'+taxInterval()+'年）';else taxTip.textContent=welfareCount()+'名民生官员：'+Math.max(0,taxInterval()-(state.year-state.lastTaxChan     function bind(id,fn,fmt=v=>v,allow=policyOpen){let el=document.getElementById(id),out=document.getElementById('o-'+id);el.oninput=()=>{out.textContent=fmt(el.value);if(allow())fn(+el.value)};el.oninput()}newGame();bind('tf',v=>setTax('farmer',v/100),v=>v+'%',taxOpen);bind('tw',v=>setTax('worker',v/100),v=>v+'%',taxOpen);bind('tm',v=>setTax('merchant',v/100),v=>v+'%',taxOpen);bind('wg',v=>state.policy.officialWage=v,v=>v+' / 人');bind('ot',v=>state.policy.officials.tax=v);bind('os',v=>state.policy.officials.security=v,v=>v,securityOpen);bind('ow',v=>state.policy.officials.welfare=v,v=>v,welfareOpen);bind('om',v=>state.policy.officials.military=v,v=>v,militaryOpen);bind('oe',v=>state.policy.officials.teacher=v);bind('mil',v=>state.policy.militaryRatio=v/100,v=>v+'%');document.querySelectorAll('.roleHelp').forEach(b=>b.onclick=e=>{e.preventDefault();document.getElementById(b.dataset.help).classList.toggle('hidden')});
    for(const id of ['warRate','warSupply','warEquip'])document.getElementById(id).onchange=updateWarEstimate;warFight.onclick=()=>decideWar('fight',warPlan());warSign.onclick=()=>decideWar('treaty');warSurrender.onclick=()=>decideWar('surrender');hist.onmousemove=e=>{if(state.history.length<2)return;let r=hist.getBoundingClientRect(),x=(e.clientX-r.left)*(hist.width/r.width),t=clamp((x-38)/(hist.width-54),0,1);chartView.hover=Math.round((chartView.start??state.history[0].year)+((chartView.end??state.history[state.history.length-1].year)-(chartView.start??state.history[0].year))*t);drawHist()};hist.onmouseleave=()=>{chartView.hover=null;drawHist()};hist.onwheel=e=>{if(!e.altKey||state.history.length<4)return;e.preventDefault();let first=state.history[0].year,last=state.history[state.history.length-1].year;if(chartView.start==null){chartView.start=first;chartView.end=last}let span=chartView.end-chartView.start+1,next=e.deltaY>0?Math.min(last-first+1,Math.ceil(span*1.35)):Math.max(4,Math.floor(span*.75)),center=chartView.hover??Math.round((chartView.start+chartView.end)/2),s=Math.round(center-next/2),en=s+next-1;if(s<first){s=first;en=first+next-1}if(en>last){en=last;s=last-next+1}chartView.start=s;chartView.end=en;drawHist()};
    next.onclick=nextYear;fast.onclick=fastForward;document.querySelectorAll('.preset').forEach(btn=>btn.onclick=()=>applyPreset(btn.dataset.preset));reset.onclick=()=>{end.classList.add('hidden');log.innerHTML='';chartView={start:null,end:null,hover:null};newGame();render()};again.onclick=reset.onclick;save.onclick=()=>{const copy=Object.assign({},state,{pendingEvent:null,pendingEventId:state.pendingEvent?.[0]||null});localStorage.setItem('mini-archon-local',JSON.stringify(copy));alert('已存档')};load.onclick=()=>{let s=localStorage.getItem('mini-archon-local');if(s){state=JSON.parse(s);state.rng=Object.assign(new RNG(1),state.rng);state.pendingEvent=state.pendingEventId?(EVENTS.find(e=>e[0]===state.pendingEventId)||null):null;delete state.pendingEventId;if(!state.flags)state.flags={};if(!Number.isFinite(state.policy.officialWage))state.policy.officialWage=C.govWage;if(state.lastTaxChangeYear==null)state.lastTaxChangeYear=null;if(!Number.isFinite(state.morality))state.morality=0;if(!Number.isFinite(state.rationality))state.rationality=0;if(!Array.isArray(state.recentEventIds))state.recentEventIds=[];if(!state.lastYearChanges)state.lastYearChanges=null;for(const p of state.people){if(!p.name)p.name='无名'+p.id;if(!p.history)p.history=[];if(!p.gender)p.gender=p.id%2?'male':'female'}uid=Math.max(uid,...state.people.map(p=>Number(p.id)||0));log.innerHTML='';render()}};
