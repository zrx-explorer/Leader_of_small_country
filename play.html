<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小国执政官 - 本地单文件版</title>
  <style>
    :root{--bg:#f5efe3;--paper:#fffaf0;--ink:#263645;--soft:#667584;--red:#b84032;--green:#2f9d63;--blue:#2f80c9;--gold:#c49321;--purple:#7d4ca0;--line:#dfd3bd}
    *{box-sizing:border-box} body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
    header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
    h1{font-size:20px;margin:0;color:var(--red)} .hud{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.hud b{font-size:15px}.warn b{color:var(--red)}
    main{display:grid;grid-template-columns:280px 1fr 300px;gap:12px;padding:12px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;box-shadow:0 2px 8px #0001}
    h2{font-size:16px;margin:0 0 10px;color:var(--red)} fieldset{border:1px solid var(--line);border-radius:6px;margin:0 0 10px;padding:8px 10px} legend{color:var(--red);font-size:12px}
    label{display:block;font-size:13px;color:var(--soft);margin:8px 0} output{float:right;color:var(--ink);font-weight:700} input[type=range]{width:100%;accent-color:var(--red)}
    button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:8px 14px;cursor:pointer}button:hover{background:white}.primary{background:var(--red);border-color:var(--red);color:white;font-weight:700}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.charts{display:grid;grid-template-columns:300px 1fr;gap:10px}.chart{border:1px solid var(--line);border-radius:6px;background:white;padding:8px}
    canvas{max-width:100%;height:auto}.log{font-size:13px;line-height:1.7;max-height:70vh;overflow:auto}.year{color:var(--red);font-weight:700;margin-top:8px}.line{border-left:2px solid var(--line);padding-left:8px;color:var(--soft)}
    .people{margin-top:12px;border:1px solid var(--line);border-radius:8px;background:#fffdf7;padding:10px}.people-head{display:flex;justify-content:space-between;color:var(--soft);font-size:12px}.people-body{display:grid;grid-template-columns:1fr 240px;gap:10px;margin-top:8px}.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;max-height:260px;overflow:auto}.avatar{padding:6px 4px;min-height:66px;display:flex;flex-direction:column;align-items:center;gap:3px}.avatar.active{border-color:var(--red);box-shadow:0 2px 8px #0001}.face{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:700}.aname{font-size:11px;max-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.asat{font-size:10px;color:var(--soft)}.detail{border-left:1px dashed var(--line);padding-left:10px;color:var(--soft);font-size:12px;max-height:260px;overflow:auto}.dtitle{font-size:15px;color:var(--ink);font-weight:700;margin-bottom:8px}.drow{display:flex;justify-content:space-between;border-bottom:1px solid #eee4d2;padding:4px 0}.histrow{display:grid;grid-template-columns:42px 1fr 64px;gap:6px;border-bottom:1px dashed #eee4d2;padding:3px 0}
    .modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:5}.hidden{display:none}.box{width:min(460px,92vw);background:var(--paper);border-top:4px solid var(--red);border-radius:8px;padding:22px;box-shadow:0 12px 36px #0005}.box p{color:var(--soft);line-height:1.7}.opts{display:grid;gap:8px}.opts button{text-align:left}
    @media(max-width:920px){main{grid-template-columns:1fr}.charts,.people-body{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.detail{border-left:0;border-top:1px dashed var(--line);padding-left:0;padding-top:8px}}
  </style>
</head>
<body>
  <header>
    <h1>小国执政官 <small>本地版 v0.2</small></h1>
    <div class="hud">
      <span>第 <b id="year">1</b> 年</span><span>人口 <b id="pop">0</b></span><span>国库 <b id="tre">0</b></span>
      <span>满意 <b id="sat">0</b></span><span>智力 <b id="intel">0</b></span><span class="warn">罪犯 <b id="crim">0</b></span>
    </div>
    <div class="controls"><button id="save">存档</button><button id="load">读档</button><button id="reset">重开</button></div>
  </header>
  <main>
    <section class="panel">
      <h2>政策调控</h2>
      <fieldset><legend>税率</legend>
        <label>农民 <output id="o-tf">5%</output><input id="tf" type="range" min="0" max="50" value="5"></label>
        <label>工人 <output id="o-tw">8%</output><input id="tw" type="range" min="0" max="50" value="8"></label>
        <label>商人 <output id="o-tm">10%</output><input id="tm" type="range" min="0" max="50" value="10"></label>
      </fieldset>
      <fieldset><legend>公务员</legend>
        <label>税务 <output id="o-ot">1</output><input id="ot" type="range" min="0" max="20" value="1"></label>
        <label>治安 <output id="o-os">1</output><input id="os" type="range" min="0" max="20" value="1"></label>
        <label>民生 <output id="o-ow">0</output><input id="ow" type="range" min="0" max="20" value="0"></label>
        <label>军事 <output id="o-om">0</output><input id="om" type="range" min="0" max="20" value="0"></label>
        <label>教师 <output id="o-oe">2</output><input id="oe" type="range" min="0" max="20" value="2"></label>
      </fieldset>
      <fieldset><legend>军费</legend><label>国库占比 <output id="o-mil">5%</output><input id="mil" type="range" min="0" max="50" value="5"></label></fieldset>
    </section>
    <section class="panel">
      <h2>国家概览</h2>
      <div class="charts"><div class="chart"><canvas id="pie" width="280" height="220"></canvas></div><div class="chart"><canvas id="hist" width="560" height="220"></canvas></div></div>
      <div class="controls"><button id="next" class="primary">下一年</button><span id="tip">目标：撑过 30 年后进入持续经营。政策每 3 年开放一次。</span></div>
      <div class="people"><div class="people-head"><b>国民个体</b><span>点击头像查看阶级与满意度变化</span></div><div class="people-body"><div id="peopleGrid" class="people-grid"></div><div id="personDetail" class="detail">选择一位国民查看履历</div></div></div>
    </section>
    <section class="panel"><h2>朝堂日志</h2><div id="log" class="log"></div></section>
  </main>
  <div id="event" class="modal hidden"><div class="box"><h2 id="et"></h2><p id="ed"></p><div id="eo" class="opts"></div></div></div>
  <div id="end" class="modal hidden"><div class="box"><h2 id="endt"></h2><p id="endd"></p><button id="again" class="primary">再来一局</button></div></div>
  <script>
    const C={grainNeed:10,grainReserveNeed:20,productNeedBase:1,productReserveNeed:3,rebelThreshold:-30,farmerProdMean:180,farmerProdJitter:18,workerProdMean:30,workerProdJitter:1.5,productionCost:1.5,govWage:10,birthAgeMin:18,birthAgeMax:30,deathStartAge:50,deathHardCap:95};
    const cls=['farmer','worker','merchant','official'], colors={farmer:'#2f9d63',worker:'#2f80c9',merchant:'#c49321',official:'#7d4ca0'}, names={farmer:'农民',worker:'工人',merchant:'商人',official:'公务员'};
    class RNG{constructor(seed=Date.now()){this.s=(seed>>>0)||1}next(){let x=this.s;x^=x<<13;x^=x>>>17;x^=x<<5;this.s=x>>>0;return this.s/4294967295}u(a,b){return a+(b-a)*this.next()}i(a,b){return Math.floor(this.u(a,b+1))}n(m,s){let u=0,v=0;while(!u)u=this.next();while(!v)v=this.next();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}c(p){return this.next()<p}}
    const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)); const compact=n=>{n=Number(n)||0;let a=Math.abs(n);if(a>=1e6)return(n/1e6).toFixed(a>=1e7?0:1)+'M';if(a>=1e4)return(n/1e4).toFixed(a>=1e5?0:1)+'万';if(a>=1e3)return(n/1e3).toFixed(a>=1e4?0:1)+'K';return String(Math.round(n))}; let uid=0,state,selectedId=null,chartView={start:null,end:null,hover:null};const surn='赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦尤许何吕施张孔曹严华金魏陶姜戚谢邹喻柏水窦章云苏潘葛范彭郎鲁韦昌马苗凤花方俞任袁柳鲍史唐费廉岑薛雷贺倪汤'.split(''),given='安邦承德明远知礼怀仁景行守正敬文思齐修远仲平子谦伯宁元直文昌德厚清和嘉言有恒'.match(/.{1,2}/g);const pname=r=>surn[r.i(0,surn.length-1)]+given[r.i(0,given.length-1)];
    function person(r,k,age){return{id:++uid,name:pname(r),klass:k,age:age??r.i(18,40),intelligence:Math.round(clamp(r.n(50,15),0,100)),satisfaction:12,grain:42,product:6,isCriminal:false,role:null,history:[]}}
    function rec(){for(const p of state.people){if(!p.history)p.history=[];let e={year:state.year,klass:p.klass,satisfaction:+p.satisfaction.toFixed(2)},l=p.history[p.history.length-1];if(!l||l.year!==state.year)p.history.push(e);else Object.assign(l,e);if(p.history.length>120)p.history.shift()}}
    function newGame(){let rng=new RNG(Date.now()), people=[]; for(const [k,n] of Object.entries({farmer:18,worker:6,merchant:2,official:4}))for(let i=0;i<n;i++)people.push(person(rng,k)); state={year:1,rng,people,treasury:1000,policy:{tax:{farmer:.05,worker:.08,merchant:.10},militaryRatio:.05,officials:{tax:1,security:1,welfare:0,military:0,teacher:2}},history:[],log:['【立国】游戏开始，初始人口 '+people.length],pendingEvent:null,over:null,bad:0,crime:0,low:0,storyHooks:[]}; stat();rec();selectedId=people[0]?.id}
    function stat(){let s={total:state.people.length,byClass:{farmer:0,worker:0,merchant:0,official:0},avgSatisfaction:0,avgIntelligence:0,avgWealth:0,criminals:0,classWealth:{farmer:0,worker:0,merchant:0,official:0},classSat:{farmer:0,worker:0,merchant:0,official:0},classCount:{farmer:0,worker:0,merchant:0,official:0}}; for(const p of state.people){s.byClass[p.klass]++;s.avgSatisfaction+=p.satisfaction;s.avgIntelligence+=p.intelligence;let w=p.grain+p.product*2;s.avgWealth+=w;s.classWealth[p.klass]+=w;s.classSat[p.klass]+=p.satisfaction;s.classCount[p.klass]++;if(p.isCriminal)s.criminals++} if(s.total){s.avgSatisfaction=+(s.avgSatisfaction/s.total).toFixed(2);s.avgIntelligence=+(s.avgIntelligence/s.total).toFixed(2);s.avgWealth=+(s.avgWealth/s.total).toFixed(2);for(const k of cls)if(s.classCount[k]){s.classWealth[k]=+(s.classWealth[k]/s.classCount[k]).toFixed(2);s.classSat[k]=+(s.classSat[k]/s.classCount[k]).toFixed(2)}} state.stats=s}
    function mods(log){let farm=clamp(state.rng.n(1,.08),.82,1.18),work=clamp(state.rng.n(1,.05),.88,1.12),price=clamp(state.rng.n(1,.04),.9,1.1),birth=state.rng.u(-.015,.015); if(farm>1.08)log.push('雨水充沛，农产略增'); else if(farm<.92)log.push('天气欠佳，农产略减'); if(price>1.05)log.push('市价微涨，交易成本提高'); else if(price<.95)log.push('市价平稳偏低，交易更顺畅'); return{farm,work,price,birth}}
    function nextYear(){if(state.over||state.pendingEvent)return; let log=['━━ 第 '+state.year+' 年 ━━'],m=mods(log),offs=state.people.filter(p=>p.klass==='official'); let roles=state.policy.officials,j=0; for(const r of Object.keys(roles))for(let n=0;n<roles[r]&&j<offs.length;n++,j++)offs[j].role=r; for(;j<offs.length;j++)offs[j].role='governor';
      for(const p of state.people){if(p.isCriminal)continue; if(p.klass==='farmer'){let out=(C.farmerProdMean/10+C.farmerProdJitter*(clamp(p.intelligence,10,100)-50)/100+state.rng.u(-1,1))*m.farm;p.grain+=Math.max(0,out)} if(p.klass==='worker'){let out=(C.workerProdMean/5+C.workerProdJitter*(clamp(p.intelligence,10,100)-50)/100+state.rng.u(-.5,.5))*m.work;p.product+=Math.max(0,out);p.grain-=C.productionCost*Math.max(0,out)/5}}
      trade(log,m.price); tax(log); wages(log); educate(log); for(const p of state.people){p.grain-=C.grainNeed;p.product=Math.max(0,p.product-C.productNeedBase)} stat(); satisfy(); crime(log); birth(log,m.birth); death(log); mobility(log); stat(); rec(); state.history.push({year:state.year,population:state.stats.total,treasury:Math.round(state.treasury),avgSatisfaction:state.stats.avgSatisfaction}); outcome(); if(!state.over)state.pendingEvent=rollEvent(); state.log=log; state.year++; render()}
    function trade(log,pm){let ws=state.people.filter(p=>p.klass==='worker'&&!p.isCriminal),ms=state.people.filter(p=>p.klass==='merchant'&&!p.isCriminal),bs=state.people.filter(p=>p.klass==='farmer'||p.klass==='official'); if(!ws.length||!ms.length||!bs.length)return; let supply=ws.reduce((a,w)=>a+w.product,0)*.7/ms.length,wp=3*pm; for(const m of ms){let b=0;for(const w of ws){let take=Math.min(w.product*.5,supply-b);if(take<=0)continue;w.product-=take;w.grain+=take*wp;m.grain-=take*wp;m.product+=take;b+=take;if(b>=supply)break}} for(const b of bs){let need=Math.max(C.productNeedBase,Math.min(4,Math.max(0,-(b.satisfaction-12)*(b.satisfaction-15)+2))),m=ms[state.rng.i(0,ms.length-1)],price=wp*(b.klass==='official'?1.1:1.2),buy=Math.min(need,m.product,b.grain/price);if(buy>0){m.product-=buy;m.grain+=buy*price;b.grain-=buy*price;b.product+=buy}} log.push('商人撮合产品 '+ms.length+' 名商人参与交易')}
    function tax(log){let total=0;for(const p of state.people){if(p.isCriminal)continue;let t=0;if(p.klass==='farmer')t=Math.max(0,p.grain*state.policy.tax.farmer);else if(p.klass==='worker')t=Math.max(0,p.product*3*state.policy.tax.worker);else if(p.klass==='merchant')t=Math.max(0,p.grain*.1*state.policy.tax.merchant);p.grain-=t;total+=t}state.treasury+=total;log.push('税收 +'+total.toFixed(1))}
    function wages(log){let cost=0;for(const o of state.people.filter(p=>p.klass==='official')){if(state.treasury-cost>=C.govWage){o.grain+=C.govWage;cost+=C.govWage}else o.satisfaction-=1}state.treasury-=cost;state.treasury-=state.treasury*state.policy.militaryRatio;log.push('公务员工资与军费支出 -'+(cost).toFixed(1))}
    function educate(log){let ts=state.people.filter(p=>p.role==='teacher'),ss=state.people.filter(p=>p.klass!=='official'&&p.intelligence<100).slice(0,ts.length*10);for(const s of ss){s.intelligence=Math.min(100,s.intelligence+.25);s.satisfaction+=.5}if(ss.length)log.push(ts.length+' 名教师授课 '+ss.length+' 人')}
    function satisfy(){let vals=cls.filter(k=>state.stats.classCount[k]).map(k=>state.stats.classWealth[k]),gap=vals.length>1?Math.max(...vals)-Math.min(...vals):0,pen=clamp(2*Math.atan(1.8)+2*Math.atan(2*(gap/10)-1.8),0,8),poor=cls.reduce((a,k)=>state.stats.classCount[k]&&state.stats.classWealth[k]<(state.stats.classWealth[a]??1e9)?k:a,null);for(const p of state.people){let d=0;if(p.grain<C.grainNeed)d-=3;else if(p.grain<C.grainReserveNeed)d-=1;else d+=.5;if(p.product<C.productNeedBase)d-=1;else if(p.product<C.productReserveNeed)d-=.2;if(p.klass===poor&&(p.klass==='farmer'||p.klass==='worker'))d-=pen*.3;p.satisfaction=clamp(p.satisfaction+d,-30,30)}}
    function crime(log){let q=state.people.filter(p=>p.role==='security').length;for(const p of state.people){if(p.satisfaction<=C.rebelThreshold){if(q>0){q--;p.satisfaction+=2}else p.isCriminal=true}else p.isCriminal=false}let c=state.people.filter(p=>p.isCriminal);for(const x of c){let t=state.people[state.rng.i(0,state.people.length-1)],loot=Math.min(t.grain*.3,20);if(t!==x&&loot>0){t.grain-=loot;x.grain+=loot;t.satisfaction-=1}} if(c.length)log.push(c.length+' 名罪犯进行了掠夺')}
    function birth(log,b){let ranges={farmer:[.1,.4],worker:[.2,.8],merchant:[.1,.6]},n=0,msg=[];for(const k of Object.keys(ranges)){let c=state.people.filter(p=>p.klass===k&&!p.isCriminal).length,a=state.rng.u(ranges[k][0],ranges[k][1]),num=Math.floor(a*.5*c);for(let i=0;i<num;i++){let baby=person(state.rng,k,0);baby.grain=5;baby.product=1;state.people.push(baby)}n+=num;if(num)msg.push(names[k]+' '+num+' 人(a='+a.toFixed(2)+')')} if(n)log.push('新生 '+n+' 人：'+msg.join('，'))}
    function death(log){let n=0;for(let i=state.people.length-1;i>=0;i--){let p=state.people[i];p.age++;let prob=p.age<50?0:p.age>=95?1:clamp(.015+Math.pow((p.age-50)/45,2)*.22,0,.6);if(state.rng.c(prob)){state.people.splice(i,1);n++}} if(n)log.push(n+' 人逝世')}
    function mobility(log){for(const [a,b] of [['farmer','worker'],['worker','merchant']]){let cs=state.people.filter(p=>p.klass===a&&!p.isCriminal&&p.satisfaction>0).sort((x,y)=>y.intelligence-x.intelligence);if(cs.length>3&&cs[0].intelligence>70){cs[0].klass=b;log.push('一名'+names[a]+'升为'+names[b])}} for(const [a,b] of [['merchant','worker'],['worker','farmer']]){let ls=state.people.filter(p=>p.klass===a&&p.grain<0).sort((x,y)=>x.grain-y.grain);if(ls.length){ls[0].klass=b;ls[0].grain=Math.max(0,ls[0].grain);log.push('一名'+names[a]+'降为'+names[b])}}}
    const EVENTS=[['merchant','商队来访','远方商队请求入境贸易。',[['征收高税（国库 +150 / 满意度 -1）',s=>{s.treasury+=150;s.people.forEach(p=>p.satisfaction-=1)}],['低税迎客（国库 +30 / 满意度 +2）',s=>{s.treasury+=30;s.people.forEach(p=>p.satisfaction+=2)}]]],['harvest','风调雨顺','今年五谷丰登。',[['加征余粮入库（国库 +300）',s=>{s.treasury+=300;s.people.forEach(p=>p.grain-=3)}],['藏粮于民（满意度 +2）',s=>s.people.forEach(p=>p.satisfaction+=2)]]],['plague','瘟疫蔓延','城中现疫情，民众惶恐。',[['封城治疗（国库 -300）',s=>s.treasury-=300],['不闻不问（随机 5% 死亡）',s=>{let d=Math.floor(s.people.length*.05);for(let i=0;i<d;i++)s.people.splice(s.rng.i(0,s.people.length-1),1)}]]]];
    function rollEvent(){let pool=EVENTS.filter(e=>e[0]!=='plague'||(state.year>=5&&state.stats.total>=30));return state.rng.c(.5)?pool[state.rng.i(0,pool.length-1)]:null}
    function outcome(){if(!state.stats.total){state.over='lose:人口归零';return} if(state.treasury<0){if(++state.bad>=3){state.over='lose:国库连续 3 年破产';return}}else state.bad=0; if(state.stats.criminals/state.stats.total>.45){if(++state.crime>=2){state.over='lose:革命爆发';return}}else state.crime=0; if(state.stats.avgSatisfaction<-24){if(++state.low>=5){state.over='lose:民心尽失';return}}else state.low=0; if(!state.goalMet&&state.year>=30&&state.stats.total>=20&&state.stats.avgSatisfaction>=-15){state.goalMet=true;state.log.push('章节目标达成：立国。国家进入持续经营阶段。')}}
    function render(){stat(); year.textContent=state.year;pop.textContent=state.stats.total;tre.textContent=compact(state.treasury);tre.title=Math.round(state.treasury);sat.textContent=state.stats.avgSatisfaction;intel.textContent=state.stats.avgIntelligence;crim.textContent=state.stats.criminals;drawPie();drawHist();renderPeople();updatePolicyLock();let d=document.createElement('div');d.innerHTML=state.log.map((x,i)=>i?'<div class=line>'+x+'</div>':'<div class=year>'+x+'</div>').join('');log.prepend(d);while(log.children.length>30)log.removeChild(log.lastChild); if(state.pendingEvent)showEvent(); else document.getElementById('event').classList.add('hidden'); if(state.over){endt.textContent='游戏结束';endd.textContent='原因：'+state.over.replace('lose:','');end.classList.remove('hidden')}}
    function showEvent(){let e=state.pendingEvent;et.textContent=e[1];ed.textContent=e[2];eo.innerHTML='';e[3].forEach((o,i)=>{let b=document.createElement('button');b.textContent=o[0];b.onclick=()=>{state.log.push('事件【'+e[1]+'】→ '+o[0]);o[1](state);state.pendingEvent=null;render()};eo.appendChild(b)});document.getElementById('event').classList.remove('hidden')}
    function drawPie(){let c=pie.getContext('2d'),W=pie.width,H=pie.height;c.clearRect(0,0,W,H);let total=state.stats.total,start=-Math.PI/2;for(const k of cls){let v=state.stats.byClass[k];if(!v)continue;let a=v/total*Math.PI*2;c.beginPath();c.moveTo(W/2,H/2-10);c.arc(W/2,H/2-10,75,start,start+a);c.fillStyle=colors[k];c.fill();start+=a}let x=14,y=185;c.font='12px sans-serif';for(const k of cls){c.fillStyle=colors[k];c.fillRect(x,y,10,10);c.fillStyle='#333';c.fillText(names[k]+' '+state.stats.byClass[k],x+14,y+10);x+=68}}
    function renderPeople(){if(!state.people.some(p=>p.id===selectedId))selectedId=state.people[0]?.id;peopleGrid.innerHTML=state.people.map(p=>'<button class="avatar '+(p.id===selectedId?'active':'')+'" data-id="'+p.id+'"><span class="face" style="background:'+colors[p.klass]+'">'+(p.name||'民').slice(0,1)+'</span><span class="aname">'+(p.name||('无名'+p.id))+'</span><span class="asat">满意 '+p.satisfaction.toFixed(1)+'</span></button>').join('');peopleGrid.querySelectorAll('.avatar').forEach(b=>b.onclick=()=>{selectedId=+b.dataset.id;renderPeople()});let p=state.people.find(x=>x.id===selectedId);if(!p){personDetail.textContent='选择一位国民查看履历';return}let hs=(p.history||[]).slice(-12).reverse();personDetail.innerHTML='<div class="dtitle">'+p.name+'</div><div class="drow"><span>阶级</span><b>'+names[p.klass]+'</b></div><div class="drow"><span>年龄</span><b>'+p.age+'</b></div><div class="drow"><span>满意度</span><b>'+p.satisfaction.toFixed(2)+'</b></div><div class="drow"><span>智力</span><b>'+p.intelligence.toFixed(2)+'</b></div><div class="drow"><span>粮食/产品</span><b>'+p.grain.toFixed(1)+' / '+p.product.toFixed(1)+'</b></div><div class="dtitle" style="margin-top:8px">变化记录</div>'+hs.map(h=>'<div class="histrow"><span>'+h.year+'年</span><span>'+names[h.klass]+'</span><b>'+Number(h.satisfaction).toFixed(2)+'</b></div>').join('')}
    function drawHist(){let c=hist.getContext('2d'),W=hist.width,H=hist.height,h=state.history;c.clearRect(0,0,W,H);if(h.length<2){c.strokeStyle='#e8e1d3';c.lineWidth=2;c.strokeRect(28,24,W-56,H-48);c.fillStyle='#b7b0a3';c.font='600 18px Microsoft YaHei, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('推进几年后显示人口、满意度、国库曲线',W/2,H/2);c.textAlign='left';c.textBaseline='alphabetic';return}let first=h[0].year,lastY=h[h.length-1].year;if(chartView.start==null){chartView.start=first;chartView.end=lastY}if(chartView.end===lastY-1)chartView.end=lastY;chartView.start=Math.max(first,Math.min(chartView.start,lastY-1));chartView.end=Math.min(lastY,Math.max(chartView.end,chartView.start+1));let pts=h.filter(p=>p.year>=chartView.start&&p.year<=chartView.end);if(pts.length<2)pts=h.slice(-2);let min=pts[0].year,max=pts[pts.length-1].year,xmap=y=>38+(y-min)/(max-min||1)*(W-54);c.strokeStyle='#ddd';c.strokeRect(38,32,W-54,H-66);function line(fn,col){let vs=pts.map(fn),lo=Math.min(...vs),hi=Math.max(...vs),r=hi-lo||1;c.beginPath();c.strokeStyle=col;c.lineWidth=2;pts.forEach((p,i)=>{let x=xmap(p.year),y=32+(H-66)-(vs[i]-lo)/r*(H-66);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}line(p=>p.population,colors.worker);line(p=>p.avgSatisfaction,colors.farmer);line(p=>p.treasury,colors.merchant);c.fillStyle='#8a8174';c.font='10px sans-serif';c.textAlign='center';for(let i=0;i<Math.min(6,Math.max(2,max-min+1));i++){let y=Math.round(min+(max-min)*i/(Math.min(6,Math.max(2,max-min+1))-1||1));c.fillText(y+'年',xmap(y),H-14)}c.textAlign='left';let last=pts[pts.length-1],x=38;c.font='11px sans-serif';for(const it of [{t:'人口 '+last.population,c:colors.worker},{t:'满意度 '+last.avgSatisfaction,c:colors.farmer},{t:'国库 '+compact(last.treasury),c:colors.merchant}]){c.strokeStyle=it.c;c.lineWidth=3;c.beginPath();c.moveTo(x,16);c.lineTo(x+18,16);c.stroke();c.fillStyle='#54667a';c.fillText(it.t,x+23,20);x+=118}if(chartView.hover!=null){let p=pts.reduce((a,b)=>Math.abs(b.year-chartView.hover)<Math.abs(a.year-chartView.hover)?b:a,pts[0]),hx=xmap(p.year);c.strokeStyle='#263645';c.setLineDash([4,4]);c.beginPath();c.moveTo(hx,32);c.lineTo(hx,H-34);c.stroke();c.setLineDash([]);let bx=Math.min(W-150,Math.max(8,hx+10)),by=42;c.fillStyle='rgba(255,250,240,.96)';c.strokeStyle='#dfd3bd';c.fillRect(bx,by,142,70);c.strokeRect(bx,by,142,70);c.fillStyle='#263645';['第 '+p.year+' 年','人口 '+p.population,'满意度 '+p.avgSatisfaction,'国库 '+compact(p.treasury)+' ('+p.treasury+')'].forEach((t,i)=>c.fillText(t,bx+8,by+16+i*14))}}
    function policyOpen(){return !state.over&&!state.pendingEvent&&(state.year-1)%3===0}function updatePolicyLock(){let open=policyOpen(),left=3-((state.year-1)%3);tip.textContent=open?'政策窗口开放：本年可调整税率、公务员与军费':'政策已锁定，'+left+' 年后可再次调控';document.querySelectorAll('input[type=range]').forEach(el=>el.disabled=!open)}
    function bind(id,fn,fmt=v=>v){let el=document.getElementById(id),out=document.getElementById('o-'+id);el.oninput=()=>{out.textContent=fmt(el.value);if(policyOpen())fn(+el.value)};el.oninput()} newGame(); bind('tf',v=>state.policy.tax.farmer=v/100,v=>v+'%');bind('tw',v=>state.policy.tax.worker=v/100,v=>v+'%');bind('tm',v=>state.policy.tax.merchant=v/100,v=>v+'%');bind('ot',v=>state.policy.officials.tax=v);bind('os',v=>state.policy.officials.security=v);bind('ow',v=>state.policy.officials.welfare=v);bind('om',v=>state.policy.officials.military=v);bind('oe',v=>state.policy.officials.teacher=v);bind('mil',v=>state.policy.militaryRatio=v/100,v=>v+'%');
    hist.onmousemove=e=>{if(state.history.length<2)return;let r=hist.getBoundingClientRect(),x=(e.clientX-r.left)*(hist.width/r.width),t=clamp((x-38)/(hist.width-54),0,1);chartView.hover=Math.round((chartView.start??state.history[0].year)+((chartView.end??state.history[state.history.length-1].year)-(chartView.start??state.history[0].year))*t);drawHist()};hist.onmouseleave=()=>{chartView.hover=null;drawHist()};hist.onwheel=e=>{if(!e.altKey||state.history.length<4)return;e.preventDefault();let first=state.history[0].year,last=state.history[state.history.length-1].year;if(chartView.start==null){chartView.start=first;chartView.end=last}let span=chartView.end-chartView.start+1,next=e.deltaY>0?Math.min(last-first+1,Math.ceil(span*1.35)):Math.max(4,Math.floor(span*.75)),center=chartView.hover??Math.round((chartView.start+chartView.end)/2),s=Math.round(center-next/2),en=s+next-1;if(s<first){s=first;en=first+next-1}if(en>last){en=last;s=last-next+1}chartView.start=s;chartView.end=en;drawHist()};
    next.onclick=nextYear; reset.onclick=()=>{end.classList.add('hidden');log.innerHTML='';chartView={start:null,end:null,hover:null};newGame();render()}; again.onclick=reset.onclick; save.onclick=()=>{const copy=Object.assign({},state,{pendingEvent:null});localStorage.setItem('mini-archon-local',JSON.stringify(copy));alert('已存档')}; load.onclick=()=>{let s=localStorage.getItem('mini-archon-local');if(s){state=JSON.parse(s);state.rng=Object.assign(new RNG(1),state.rng);for(const p of state.people){if(!p.name)p.name='无名'+p.id;if(!p.history)p.history=[]}render()}};
    render();
