  <script>
// GENERATED by scripts/sync-runtime.mjs; edit packages/core/src instead.
const GameCore = {};
GameCore.config = (() => {
/**
 * 全局配置与常量
 * 所有可调参数集中在此，便于策划数值平衡
 */

const CLASS = Object.freeze({
  FARMER: 'farmer',
  WORKER: 'worker',
  MERCHANT: 'merchant',
  OFFICIAL: 'official',
});

const OFFICIAL_ROLE = Object.freeze({
  TAX: 'tax',
  SECURITY: 'security',
  WELFARE: 'welfare',
  MILITARY: 'military',
  TEACHER: 'teacher',
  GOVERNOR: 'governor',
});

const DEFAULT_CONFIG = Object.freeze({
  // 基础数值
  grainNeed: 10,            // 每人每年粮食基本需求
  grainReserveNeed: 20,     // 储备需求
  productNeedBase: 1,       // 产品基本需求
  productReserveNeed: 3,    // 产品储备
  // 满意度阈值
  productDemandLow: 12,
  productDemandHigh: 15,
  rebelThreshold: -10,
  inflatedThreshold: 24,
  lowCrimeChance: 0.12,
  highCrimeChance: 0.03,

  // 生产
  farmerProdMean: 180,      // 原有产量基线；实际单人年产不低于 13 人的年口粮
  farmerProdJitter: 18,
  workerProdMean: 30,       // 原有产量基线；实际单人年产不低于 13 人的年产品需求
  workerProdJitter: 1.5,
  productionCost: 1.5,
  // 税率（玩家可调）
  taxFarmer: 0.05,
  taxWorker: 0.08,
  taxMerchant: 0.10,
  // 政府
  govWage: 20,
  militaryRatio: 0.05,
  securityUnlockYear: 5,
  welfareUnlockYear: 11,
  militaryOfficialUnlockYear: 21,
  // 教育
  teacherPerStudents: 10,
  intelligenceGainPerYear: 0.25,
  intelligenceCap: 5,
  satisfactionFromEdu: 0.5,
  // 社会动态
  birthAgeMin: 18,
  birthAgeMax: 40,
  birthRateFarmer: 0.28,
  birthRateWorker: 0.26,
  birthRateMerchant: 0.24,
  populationSoftCap: 800,
  populationHardCap: 2000,
  accidentDeathRate: 0.003,
  starvationDeathRate: 0.08,
  deathStartAge: 50,
  deathHardCap: 95,
  // 性能
  bucketModeThreshold: 300, // UI 超过该值只渲染部分个体
});

const INITIAL_POPULATION = {
  farmer: 10,
  worker: 5,
  merchant: 2,
  official: 8,
};

// 章节
const CHAPTERS = [
  { id: 1, name: '立国', goalYears: 30, minSatisfaction: -15, minPopulation: 20, init: { farmer:18, worker:6, merchant:2, official:4 } },
  { id: 2, name: '兴邦', goalYears: 50, minTreasury: 5000,   minPopulation: 200, init: { farmer:30, worker:15, merchant:5, official:10 } },
  { id: 3, name: '治世', goalYears: 50,  minIntelligence: 70, init: { farmer:60, worker:40, merchant:10, official:20 } },
  { id: 4, name: '盛世', goalYears: 100, allClassMinSat: 10,  init: { farmer:150, worker:120, merchant:30, official:40 } },
];

return { CLASS, OFFICIAL_ROLE, DEFAULT_CONFIG, INITIAL_POPULATION, CHAPTERS };
})();
GameCore.math = (() => {
/**
 * 数学工具：可复现的随机数 + 常用分布
 */

class RNG {
  constructor(seed = 1) {
    this.s = (seed >>> 0) || 1;
  }
  // 32-bit xorshift，可复现
  next() {
    let x = this.s;
    x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
    this.s = x >>> 0;
    return this.s / 0xFFFFFFFF;
  }
  uniform(a, b) { return a + (b - a) * this.next(); }
  int(a, b) { return Math.floor(this.uniform(a, b + 1)); }
  // Box-Muller 正态分布
  normal(mean = 0, std = 1) {
    let u = 0, v = 0;
    while (u === 0) u = this.next();
    while (v === 0) v = this.next();
    return mean + std * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  pick(arr) { return arr[this.int(0, arr.length - 1)]; }
  chance(p) { return this.next() < p; }
}

const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));

/** 产品需求曲线 fn = -(s-a1)*(s-a2)+2，限制非负 */
function productDemand(s, a1 = 12, a2 = 15) {
  return Math.max(0, -(s - a1) * (s - a2) + 2);
}

/** 阶级财富落差惩罚（v1 公式参数收口） */
function wealthGapPenalty(d) {
  // 原公式 fs = 2*atan(18) + 2*atan(2d-18) 当 d=0 时 ≈ π，太陡；按 d/10 缩放
  const dd = d / 10;
  return clamp(2 * Math.atan(1.8) + 2 * Math.atan(2 * dd - 1.8), 0, 8);
}

/** 死亡概率（修复 v1 除零） */
function deathProb(age, deathStart = 50, hardCap = 90) {
  if (age < deathStart) return 0;
  if (age >= hardCap) return 1;
  const t = (age - deathStart) / (hardCap - deathStart);
  return clamp(0.015 + t * t * 0.22, 0, 0.6);
}

return { RNG, clamp, productDemand, wealthGapPenalty, deathProb };
})();
GameCore.person = (() => {
/**
 * 个体 / 阶级群体定义
 */
const { CLASS } = GameCore.config;

let _uid = 0;
const nextId = () => ++_uid;

/** 读档或事件新增人口后，将后续出生编号推进到当前最大值之后。 */
function syncNextId(people) {
  _uid = Math.max(_uid, ...people.map(p => Number(p.id) || 0));
}

const SURNAMES = '赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦尤许何吕施张孔曹严华金魏陶姜戚谢邹喻柏水窦章云苏潘葛奚范彭郎鲁韦昌马苗凤花方俞任袁柳鲍史唐费廉岑薛雷贺倪汤滕殷罗毕郝邬安常乐于时傅皮卞齐康伍余元卜顾孟平黄和穆萧尹'.split('');
const GIVEN = '安邦承德明远知礼怀仁景行守正敬文思齐修远仲平子谦伯宁元直文昌德厚清和嘉言有恒'.match(/.{1,2}/g);

function createPerson(rng, klass, age) {
  const id = nextId();
  return {
    id,
    name: randomName(rng),
    klass,
    age: age ?? rng.int(18, 40),
    gender: rng.chance(0.5) ? 'male' : 'female',
    intelligence: clampInt(rng.normal(50, 15)),
    satisfaction: 12,
    grain: 42,    // 初始粮食储备
    product: 6,   // 初始产品储备
    isCriminal: false,
    isInflated: false,
    role: null,   // 公务员的具体岗位
    history: [],
  };
}

function randomName(rng) {
  const surname = SURNAMES[rng.int(0, SURNAMES.length - 1)];
  const given = GIVEN[rng.int(0, GIVEN.length - 1)];
  return surname + given;
}

function clampInt(x) {
  return Math.max(0, Math.min(100, Math.round(x)));
}

/** 创建初始人口 */
function seedPopulation(rng, init) {
  const people = [];
  for (const [klass, n] of Object.entries(init)) {
    for (let i = 0; i < n; i++) {
      const person = createPerson(rng, klass);
      // 小国开局采用均衡的性别结构，避免整阶级随机没有育龄伴侣。
      person.gender = i % 2 ? 'female' : 'male';
      people.push(person);
    }
  }
  return people;
}

/** 阶级聚合统计 */
function aggregate(people) {
  const stats = {
    total: people.length,
    byClass: { farmer: 0, worker: 0, merchant: 0, official: 0 },
    avgSatisfaction: 0,
    avgIntelligence: 0,
    avgWealth: 0,
    criminals: 0,
    inflated: 0,
    classWealth: { farmer: 0, worker: 0, merchant: 0, official: 0 },
    classSat: { farmer: 0, worker: 0, merchant: 0, official: 0 },
    classCount: { farmer: 0, worker: 0, merchant: 0, official: 0 },
  };
  if (!people.length) return stats;
  let sumS = 0, satCount = 0, sumI = 0, sumW = 0;
  const classSatCount = { farmer: 0, worker: 0, merchant: 0, official: 0 };
  for (const p of people) {
    stats.byClass[p.klass]++;
    if (!p.isCriminal) {
      sumS += p.satisfaction;
      satCount++;
      stats.classSat[p.klass] += p.satisfaction;
      classSatCount[p.klass]++;
    }
    sumI += p.intelligence;
    const w = p.grain + p.product * 2;
    sumW += w;
    stats.classWealth[p.klass] += w;
    stats.classCount[p.klass]++;
    if (p.isCriminal) stats.criminals++;
    if (p.isInflated) stats.inflated++;
  }
  stats.avgSatisfaction = satCount ? +(sumS / satCount).toFixed(2) : 0;
  stats.avgIntelligence = +(sumI / people.length).toFixed(2);
  stats.avgWealth = +(sumW / people.length).toFixed(2);
  for (const k of Object.keys(stats.classCount)) {
    if (stats.classCount[k] > 0) {
      stats.classWealth[k] = +(stats.classWealth[k] / stats.classCount[k]).toFixed(2);
      stats.classSat[k] = classSatCount[k]
        ? +(stats.classSat[k] / classSatCount[k]).toFixed(2)
        : 0;
    }
  }
  return stats;
}

function recordPersonHistory(people, year) {
  for (const p of people) {
    if (!p.name) p.name = `无名${p.id}`;
    if (!Array.isArray(p.history)) p.history = [];
    const last = p.history[p.history.length - 1];
    const entry = {
      year,
      klass: p.klass,
      satisfaction: +p.satisfaction.toFixed(2),
    };
    if (!last || last.year !== year) p.history.push(entry);
    else Object.assign(last, entry);
    if (p.history.length > 120) p.history.shift();
  }
}

return { nextId, syncNextId, createPerson, seedPopulation, aggregate, recordPersonHistory };
})();
GameCore.economy = (() => {
/**
 * 经济模拟模块：生产、交易、消费
 */
const { CLASS } = GameCore.config;
const { clamp } = GameCore.math;

/** 第一产业：农民生产粮食 */
function farmersProduce(people, cfg, rng) {
  for (const p of people) {
    if (p.klass !== CLASS.FARMER || p.isCriminal || p.age < 16) continue;
    const t = clamp(p.intelligence, 10, 100);
    const yearly = cfg.yearlyFarmMultiplier ?? 1;
    const rawOutput = (cfg.farmerProdMean / 10
      + cfg.farmerProdJitter * (t - 50) / 100
      + rng.uniform(-1, 1)) * yearly;
    // 策划基线：一名农民至少供养 13 人；高于下限的原产量保持不变。
    const output = Math.max(cfg.grainNeed * 13, rawOutput);
    p.grain += output;
    p.yearIncome = output;
  }

/** 第二产业：工人生产产品 */
function workersProduce(people, cfg, rng) {

    if (p.klass !== CLASS.WORKER || p.isCriminal || p.age < 16) continue;
    const t = clamp(p.intelligence, 10, 100);
    const yearly = cfg.yearlyWorkerMultiplier ?? 1;
    const rawOutput = (cfg.workerProdMean / 5
      + cfg.workerProdJitter * (t - 50) / 100
      + rng.uniform(-0.5, 0.5)) * yearly;
    const output = Math.max(cfg.productNeedBase * 13, rawOutput);

// 逐笔成交同时结算，商人不再因先付进货款而陷入流动性死锁。
function settleMarket(people, cfg, log) {
  const workers = people.filter(p => p.klass === CLASS.WORKER && !p.isCriminal && p.age >= 16);
  const merchants = people.filter(p => p.klass === CLASS.MERCHANT && !p.isCriminal && p.age >= 16);
  if (!workers.length) return;
  const wholesale = 3 * (cfg.yearlyPriceMultiplier ?? 1);
  let sold = 0, profit = 0, cursor = 0;
  for (const buyer of people.filter(p => !p.isCriminal && p.klass !== CLASS.WORKER)) {
    const need = buyer.age < 16 ? 1 : buyer.klass === CLASS.MERCHANT ? 1 : 3;
    let demand = Math.max(0, need + cfg.productReserveNeed - buyer.product);
    const price = buyer.klass === CLASS.FARMER ? (wholesale + 1) * 1.2 : wholesale * 1.1;
    while (demand > 0.001) {
      const worker = workers.filter(p => p.product > cfg.productReserveNeed).sort((a,b) => a.grain - b.grain)[0];
      if (!worker) break;
      const merchant = merchants.length ? merchants[cursor++ % merchants.length] : null;
      const unitPrice = merchant && merchant !== buyer ? price : wholesale;
      const quantity = Math.min(1, demand, worker.product - cfg.productReserveNeed, Math.max(0, buyer.grain - cfg.grainReserveNeed) / unitPrice);
      if (quantity <= 0.001) break;
      const payment = quantity * wholesale;
      buyer.grain -= quantity * unitPrice;
      buyer.product += quantity;
      worker.product -= quantity;
      worker.grain += payment;
      worker.yearIncome = (worker.yearIncome || 0) + payment;
      if (merchant && merchant !== buyer) {
        const margin = quantity * (unitPrice - wholesale);
        merchant.grain += margin;
        merchant.yearIncome = (merchant.yearIncome || 0) + margin;
        profit += margin;
      }
      sold += quantity;
      demand -= quantity;
    }

  if (log) log.push(`商贸成交 ${sold.toFixed(1)} 件（商人毛利 ${profit.toFixed(1)}${merchants.length ? '' : '，集市直接交易'}）`);

/** 家庭赡养先转移真实存粮，不凭空产生资源；未成年人按半份口粮。 */

    let left = needed;
    const adults = people.filter(p => !p.isCriminal && p.age >= 16 && p.grain > cfg.grainReserveNeed + cfg.grainNeed)
      .sort((a,b) => (b.klass === child.klass) - (a.klass === child.klass) || b.grain - a.grain);
    for (const adult of adults) {
      const transfer = Math.min(left, adult.grain - cfg.grainReserveNeed - cfg.grainNeed);
      adult.grain -= transfer; child.grain += transfer; left -= transfer;
      if (left <= 0) break;
    }
  }
  for (const p of people) {
    p.grain -= p.age < 16 ? cfg.grainNeed / 2 : cfg.grainNeed;
    const need = p.age < 16 || p.klass === CLASS.WORKER || p.klass === CLASS.MERCHANT ? cfg.productNeedBase : 3 * cfg.productNeedBase;
    p.product = Math.max(0, p.product - need);
  }

/**

/** 计算满意度变化 */
function updateSatisfaction(people, cfg, stats) {
  // 阶级间财富差
  const wealths = Object.entries(stats.classWealth)
    .filter(([k]) => stats.classCount[k] > 0)
    .map(([, v]) => v);
  const gap = wealths.length > 1 ? Math.max(...wealths) - Math.min(...wealths) : 0;
  const gapPenalty = wealthGapPenalty(gap);
  // 找到最穷的阶级
  let poorestClass = null, poorestWealth = Infinity;
  for (const [k, v] of Object.entries(stats.classWealth)) {
    if (stats.classCount[k] > 0 && v < poorestWealth) {
      poorestWealth = v; poorestClass = k;
    }
  }

  for (const p of people) {
    let dS = 0;
    if (p.grain < cfg.grainNeed) dS -= 3;
    else if (p.grain < cfg.grainReserveNeed) dS -= 1;
    else dS += 0.5;

    if (p.product < cfg.productNeedBase) dS -= 1;
    else if (p.product < cfg.productReserveNeed) dS -= 0.2;

    if (p.klass === poorestClass && (p.klass === CLASS.FARMER || p.klass === CLASS.WORKER)) {
      dS -= gapPenalty * 0.3;
    }
    // 对当前生活水平作评价，避免同一微小加减项无限累积至极端。
    p.satisfaction = clamp(p.satisfaction + (8 - p.satisfaction) * 0.10 + dS, -30, 30);

/** 状态判定：满意度过低或过高都可能走向犯罪；前五年不会产生罪犯。 */
function judgeStatus(people, rng, cfg, year, log) {
  if (year < cfg.crimeStartYear) return;
  let added = 0;
  for (const p of people) {
    if (p.isCriminal || p.age < 16) continue;
    const lowSeverity = Math.max(0, cfg.rebelThreshold - p.satisfaction);
    const highSeverity = Math.max(0, p.satisfaction - cfg.inflatedThreshold);
    const chance = lowSeverity > 0
      ? Math.min(0.45, cfg.lowCrimeChance + lowSeverity * 0.02)
      : highSeverity > 0
        ? Math.min(0.30, cfg.highCrimeChance + highSeverity * 0.012)
        : 0;
    if (chance > 0 && rng.chance(chance)) {
      p.isCriminal = true;
      p.isInflated = highSeverity > 0;
      added++;
    }
    p.isInflated = p.satisfaction >= cfg.inflatedThreshold;
  }
  if (added && log) log.push(`💀 满意度失衡新增 ${added} 名罪犯`);

/** 治安：单人也可处理一名；2—9 人每 2 人处理 1 名，10 人起每人 1 名。 */
function enforceSecurity(people, rng, securityCount, year, log) {

  const criminals = people.filter(p => p.isCriminal).slice(0, quota);

  for (const criminal of criminals) {

      criminal.isInflated = false;
      criminal.klass = CLASS.FARMER;
      criminal.role = null;
      criminal.satisfaction = 0;
      reformed++;
    } else {
      const index = people.indexOf(criminal);
      if (index >= 0) people.splice(index, 1);
      removed++;
    }
  }
  if (criminals.length && log) log.push(`🚓 治安官消除 ${criminals.length} 名罪犯（从良 ${reformed}，移除 ${removed}）`);
}

/** 罪犯掠夺：随机抢一个邻居的粮食 */
function plunder(people, rng, log) {
  if (!people.length) return;
  const criminals = people.filter(p => p.isCriminal);
  for (const c of criminals) {
    const victims = people.filter(p => !p.isCriminal && p.id !== c.id);
    if (!victims.length) break;
    const target = victims[rng.int(0, victims.length - 1)];
    const loot = Math.min(target.grain * 0.3, 20);
    if (loot > 0) {
      target.grain -= loot;
      target.satisfaction -= 1;

/** 生育：只有同阶级育龄的一男一女配对后才可能生育。 */
function birth(people, rng, cfg, log) {

  const rates = {
    [CLASS.FARMER]: cfg.birthRateFarmer,
    [CLASS.WORKER]: cfg.birthRateWorker,
    [CLASS.MERCHANT]: cfg.birthRateMerchant,
    [CLASS.OFFICIAL]: cfg.birthRateMerchant,
  };
  let births = 0;
  const summary = [];
  const pressure = Math.max(0, 1 - people.length / cfg.populationSoftCap);
  const resourceFactor = Math.max(0.15, Math.min(1, people.filter(p => !p.isCriminal && p.grain >= cfg.grainReserveNeed).length / Math.max(1, people.length)));
  for (const [klass, baseRate] of Object.entries(rates)) {
    const fertile = people.filter(p => p.klass === klass && !p.isCriminal && p.age >= cfg.birthAgeMin && p.age <= cfg.birthAgeMax);
    const males = fertile.filter(p => p.gender === 'male').length;
    const females = fertile.filter(p => p.gender === 'female').length;
    const couples = Math.min(males, females);
    if (!couples) continue;
    const rate = Math.max(0, baseRate + (cfg.yearlyBirthBonus || 0)) * pressure * resourceFactor;
    let n = 0;
    for (let i = 0; i < couples; i++) if (rng.chance(rate)) n++;
    n = Math.min(n, cfg.populationHardCap - people.length);
    for (let i = 0; i < n; i++) {
      const baby = createPerson(rng, klass, 0);
      baby.grain = 5; baby.product = 1;
      people.push(baby);
    }
    births += n;
    if (n) summary.push(`${className(klass)} ${n} 人（${couples} 对育龄伴侣）`);
  }
  if (births && log) log.push(`👶 新生 ${births} 人：${summary.join('，')}`);

/** 老化与死亡 */
function ageAndDie(people, rng, cfg, log) {

  for (let i = people.length - 1; i >= 0; i--) {
    const p = people[i];
    p.age += 1;
    let cause = null;
    if (rng.chance(cfg.accidentDeathRate)) cause = 'accident';
    else if (rng.chance(deathProb(p.age, cfg.deathStartAge, cfg.deathHardCap))) cause = 'age';
    else if (p.grain < 0 && rng.chance(Math.min(0.5, cfg.starvationDeathRate + Math.abs(p.grain) / 200))) cause = 'starvation';
    if (cause) {
      people.splice(i, 1);
      causes[cause]++;
    }
  }
  const deaths = causes.accident + causes.age + causes.starvation;
  if (deaths && log) log.push(`🪦 ${deaths} 人逝世（事故 ${causes.accident}、年老 ${causes.age}、饥饿 ${causes.starvation}）`);
}

/** 阶级流动：阶层升降 */
function classMobility(people, log) {
  // 升级：各阶级智力最高者，连续 3 年达标，进入更高阶级
  const order = [CLASS.FARMER, CLASS.WORKER, CLASS.MERCHANT];
  for (const person of people) {
    const qualified = person.age >= 18 && !person.isCriminal && person.intelligence > 70 && person.satisfaction > 0;
    person.promotionYears = qualified ? (person.promotionYears || 0) + 1 : 0;
  }
  for (let i = 0; i < order.length - 1; i++) {
    const from = order[i], to = order[i + 1];
    const candidates = people
      .filter(p => p.klass === from && !p.isCriminal && p.age >= 18 && p.satisfaction > 0)
      .sort((a, b) => b.intelligence - a.intelligence);
    const floor = Math.max(4, Math.ceil(people.length * (from === CLASS.FARMER ? 0.4 : 0.18)));
    const destination = people.filter(p => p.klass === to && !p.isCriminal).length;
    if (candidates.length > floor && destination < people.length * (to === CLASS.MERCHANT ? 0.10 : 0.25) && candidates[0].intelligence > 70) {
      if (candidates[0].promotionYears < 3) continue;
      candidates[0].klass = to;
      candidates[0].promotionYears = 0;
      if (log) log.push(`⬆ 一名${className(from)}升为${className(to)}`);
    }
  }
  // 降级：连续低资产者下降
  for (let i = order.length - 1; i > 0; i--) {
    const from = order[i], to = order[i - 1];
    const losers = people
      .filter(p => p.klass === from && !p.isCriminal && p.grain < 0)
      .sort((a, b) => a.grain - b.grain);
    if (losers.length) {
      losers[0].klass = to;
      losers[0].grain = Math.max(0, losers[0].grain);
      if (log) log.push(`⬇ 一名${className(from)}降为${className(to)}`);
    }
  }
}

return { updateSatisfaction, judgeStatus, enforceSecurity, plunder, birth, ageAndDie, classMobility };

    } else if (p.klass === CLASS.WORKER) {
      tax = Math.max(0, (p.yearIncome || 0) * policy.tax.worker);
    } else if (p.klass === CLASS.MERCHANT) {
      tax = Math.max(0, (p.yearIncome || 0) * policy.tax.merchant);
    }
    tax = Math.min(tax, Math.max(0, p.grain - 10));
    p.grain -= tax;
    total += tax;
  }
  if (log) {
    const uncovered = taxable.length - covered.length;
    log.push(`💰 税收 +${total.toFixed(1)}（${taxOfficerCount} 名税务官管辖 ${covered.length} 人${uncovered > 0 ? `，${uncovered} 人未纳入征税` : ''}）`);

GameCore.war = (() => {
const { OFFICIAL_ROLE } = GameCore.config;

const SUPPLY_COST = [0, 5, 10, 18];
const EQUIPMENT_COST = [0, 8, 18, 34];

function eligibleConscripts(people) {

}

  const equipment = clampInt(plan.equipmentLevel, 1, 3);

}

function maybeStartWar(state) {

  if (state.lastWarYear != null && state.year - state.lastWarYear < 10) return null;
  const eligible = eligibleConscripts(state.people).length;
  if (eligible < 8 || !state.rng.chance(0.08)) return null;
  const enemyStrength = Math.max(6, Math.round(eligible * state.rng.uniform(0.18, 0.55)));

function treatyTaxFloor(state) {

function enforceTreatyTaxFloor(state, log) {

function fight(state, war, decision) {
  const plan = estimateWarCost(state, decision);
  state.treasury -= plan.total;
  const assignedMilitary = state.people.filter(p => !p.isCriminal && p.role === OFFICIAL_ROLE.MILITARY).length;
  const availableOfficials = state.people.filter(p => !p.isCriminal && p.klass === 'official').length;

    ? Math.max(assignedMilitary, Math.min(availableOfficials, state.policy.officials.military || 0))
    : assignedMilitary;

  const preparedness = 1 + Math.min(0.30, (state.policy.militaryRatio || 0) * 0.6);
  const readiness = 0.55 + plan.supply * 0.30 + plan.equipment * 0.40;
  const power = plan.troops * readiness * command * preparedness * state.rng.uniform(0.88, 1.12);
  const ratio = power / Math.max(1, war.enemyStrength);
  let outcome, casualtyRate, satisfaction;
  if (ratio >= 1.2) {
    outcome = 'victory'; casualtyRate = state.rng.uniform(0.12, 0.22); satisfaction = 2;
  } else if (ratio >= 0.85) {
    outcome = 'costly_victory'; casualtyRate = state.rng.uniform(0.26, 0.40); satisfaction = 0.5;
  } else {
    outcome = 'defeat'; casualtyRate = state.rng.uniform(0.50, 0.70); satisfaction = -4;

      Math.round(state.people.length * state.rng.uniform(0.01, 0.035)),
    );

  }
  state.people.forEach(p => { if (!p.isCriminal) p.satisfaction += satisfaction; });
  const label = outcome === 'victory' ? '胜利' : outcome === 'costly_victory' ? '惨胜' : '战败';
  state.log.push(`⚔ 对${war.enemyName}战争${label}：征兵 ${plan.troops}，军费 ${plan.total.toFixed(0)}，阵亡 ${casualties}${civilianCasualties ? `，平民死亡 ${civilianCasualties}` : ''}${reward ? `，战利品 ${reward}` : ''}`);

function surrender(state, war) {
  const payment = Math.round(Math.max(300, state.people.length * 4, Math.max(0, state.treasury) * 0.30));
  state.treasury -= payment;
  state.people.forEach(p => { if (!p.isCriminal) p.satisfaction -= 3; });
  state.log.push(`🏳 向${war.enemyName}投降，直接赔款 ${payment}`);
  return { year:state.year, action:'surrender', outcome:'surrender', cost:payment, casualties:0 };

function signTreaty(state, war, treaty) {
  activateTreaty(state, treaty);
  state.people.forEach(p => { if (!p.isCriminal) p.satisfaction -= 1.5; });
  state.log.push(`📜 与${war.enemyName}签订 ${treaty.duration} 年赔款条约：立即赔款 ${treaty.upfront}，每年固定 ${treaty.annualFlat}${treaty.taxShare ? ` + 税收 ${(treaty.taxShare*100).toFixed(0)}%` : ''}${treaty.minTaxRate ? `，税率不得低于 ${(treaty.minTaxRate*100).toFixed(0)}%` : ''}`);
  return { year:state.year, action:'treaty', outcome:'treaty', cost:treaty.upfront, casualties:0, treaty:{...treaty} };

function createTreaty(state, punitive) {
  const duration = state.rng.int(punitive ? 5 : 3, punitive ? 8 : 6);
  const hasTaxClause = state.rng.chance(punitive ? 0.90 : 0.65);
  const treasury = Math.max(0, state.treasury);
  return {
    duration,
    upfront: Math.round(Math.max(punitive ? 250 : 120, treasury * (punitive ? 0.16 : 0.08))),
    annualFlat: Math.round(Math.max(40, state.people.length * (punitive ? 0.50 : 0.30))),
    taxShare: hasTaxClause ? +(state.rng.uniform(punitive ? 0.30 : 0.20, punitive ? 0.50 : 0.40).toFixed(2)) : 0,
    minTaxRate: hasTaxClause ? state.rng.int(punitive ? 8 : 5, punitive ? 16 : 13) / 100 : 0,
  };

function activateTreaty(state, treaty) {
  state.treasury -= treaty.upfront;
  state.treaty = { ...treaty, startYear:state.year, endYear:state.year + treaty.duration - 1 };
  enforceTreatyTaxFloor(state, state.log);

function treatyActive(state) {
  return Boolean(state.treaty && state.year <= state.treaty.endYear);

  let removed = 0;
  const pool = candidates.slice();

    const pick = state.rng.int(0, pool.length - 1);
    const person = pool.splice(pick, 1)[0];
    const index = state.people.indexOf(person);
    if (index >= 0) { state.people.splice(index, 1); removed++; }

  return removed;

function clampInt(x, lo, hi) { return Math.round(clamp(Number(x) || lo, lo, hi)); }

    function drawHist(){let c=hist.getContext('2d'),W=hist.width,H=hist.height,h=state.history;c.clearRect(0,0,W,H);if(h.length<2){c.strokeStyle='#e8e1d3';c.lineWidth=2;c.strokeRect(28,24,W-56,H-48);c.fillStyle='#b7b0a3';c.font='600 18px Microsoft YaHei, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('推进几年后显示人口、满意度、国库曲线',W/2,H/2);c.textAlign='left';c.textBaseline='alphabetic';return}let first=h[0].year,lastY=h[h.length-1].year;if(chartView.start==null){chartView.start=first;chartView.end=lastY}if(chartView.end===lastY-1)chartView.end=lastY;chartView.start=Math.max(first,Math.min(chartView.start,lastY-1));chartView.end=Math.min(lastY,Math.max(chartView.end,chartView.start+1));let pts=h.filter(p=>p.year>=chartView.start&&p.year<=chartView.end);if(pts.length<2)pts=h.slice(-2);let min=pts[0].year,max=pts[pts.length-1].year,xmap=y=>38+(y-min)/(max-min||1)*(W-54);c.strokeStyle='#ddd';c.strokeRect(38,32,W-54,H-66);function line(fn,col){let vs=pts.map(fn),lo=Math.min(...vs),hi=Math.max(...vs),r=hi-lo||1;c.beginPath();c.strokeStyle=col;c.lineWidth=2;pts.forEach((p,i)=>{let x=xmap(p.year),y=32+(H-66)-(vs[i]-lo)/r*(H-66);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}line(p=>p.population,colors.worker);line(p=>p.avgSatisfaction,colors.farmer);line(p=>p.treasury,colors.merchant);c.fillStyle='#8a8174';c.font='10px sans-serif';c.textAlign='center';for(let i=0;i<Math.min(6,Math.max(2,max-min+1));i++){let y=Math.round(min+(max-min)*i/(Math.min(6,Math.max(2,max-min+1))-1||1));c.fillText(y+'年',xmap(y),H-14)}c.textAlign='left';let last=pts[pts.length-1],x=38;c.font='11px sans-serif';for(const it of [{t:'人口 '+last.population,c:colors.worker},{t:'满意度 '+last.avgSatisfaction,c:colors.farmer},{t:'国库 '+compact(last.treasury),c:colors.merchant}]){c.strokeStyle=it.c;c.lineWidth=3;c.beginPath();c.moveTo(x,16);c.lineTo(x+18,16);c.stroke();c.fillStyle='#54667a';c.fillText(it.t,x+23,20);x+=118}if(chartView.hover!=null){let p=pts.reduce((a,b)=>Math.abs(b.year-chartView.hover)<Math.abs(a.year-chartView.hover)?b:a,pts[0]),hx=xmap(p.year);c.strokeStyle='#263645';c.setLineDash([4,4]);c.beginPath();c.moveTo(hx,32);c.lineTo(hx,H-34);c.stroke();c.setLineDash([]);let bx=Math.min(W-150,Math.max(8,hx+10)),by=42;c.fillStyle='rgba(255,250,240,.96)';c.strokeStyle='#dfd3bd';c.fillRect(bx,by,142,70);c.strokeRect(bx,by,142,70);c.fillStyle='#263645';['第 '+p.year+' 年','人口 '+p.population,'满意度 '+p.avgSatisfaction,'国库 '+compact(p.treasury)+' ('+p.treasury+')'].forEach((t,i)=>c.fillText(t,bx+8,by+16+i*14))}}
    function policyOpen(){return !transition.busy&&!state.over&&!state.pendingEvent&&!state.pendingWar&&(state.year-1)%3===0}function securityOpen(){return !transition.busy&&!state.over&&!state.pendingEvent&&!state.pendingWar&&state.year>=5}function welfareOpen(){return policyOpen()&&state.year>=11}function militaryOpen(){return policyOpen()&&state.year>=21}function welfareCount(){return state.people.filter(p=>!p.isCriminal&&p.role==='welfare').length}function taxInterval(){let n=welfareCount();return n>10?1:Math.max(1,11-n)}function taxOpen(){if(transition.busy)return false;if(state.over||state.pendingEvent||state.pendingWar)return false;if(state.people.length<=100)return policyOpen();if(!welfareCount())return false;if(state.lastTaxChangeYear==null||state.lastTaxChangeYear===state.year)return true;return state.year-state.lastTaxChangeYear>=taxInterval()}function setTax(k,v){if(!taxOpen())return;v=Math.max(v,state.treaty?.minTaxRate||0);if(state.policy.tax[k]===v)return;state.policy.tax[k]=v;state.lastTaxChangeYear=state.year}function updatePolicyLock(){let open=policyOpen(),left=3-((state.year-1)%3),floor=Math.round((state.treaty?.minTaxRate||0)*100);tip.textContent=open?'政策窗口开放：本年可调整公务员与军费':'政策已锁定，'+left+' 年后可再次调控；治安官第 5 年起可单独调整';presetTip.textContent=open?'政策窗口开放，可一键应用':'政策已锁定，'+left+' 年后开放';document.querySelectorAll('input[type=range]').forEach(el=>{if(['tf','tw','tm'].includes(el.id)){el.disabled=!taxOpen();el.min=floor}else if(el.id==='os')el.disabled=!securityOpen();else if(el.id==='ow')el.disabled=!welfareOpen();else if(el.id==='om')el.disabled=!militaryOpen();else el.disabled=!open});document.querySelectorAll('.preset').forEach(el=>el.disabled=!open);if(floor)taxTip.textContent='条约期内税率不得低于'+floor+'%';else if(state.people.length<=100)taxTip.textContent='人口不超过100：税率随常规政策窗口调整';else if(!welfareCount())taxTip.textContent='人口超过100且无民生官员：税率锁定';else if(taxOpen())taxTip.textContent=welfareCount()+'名民生官员：本年可调税（间隔'+taxInterval()+'年）';else taxTip.textContent=welfareCount()+'名民生官员：'+Math.max(0,taxInterval()-(state.year-state.lastTaxChangeYear))+'年后可调税'}
    function bind(id,fn,fmt=v=>v,allow=policyOpen){let el=document.getElementById(id),out=document.getElementById('o-'+id);el.oninput=()=>{out.textContent=fmt(el.value);if(allow())fn(+el.value)};el.oninput()}newGame();bind('tf',v=>setTax('farmer',v/100),v=>v+'%',taxOpen);bind('tw',v=>setTax('worker',v/100),v=>v+'%',taxOpen);bind('tm',v=>setTax('merchant',v/100),v=>v+'%',taxOpen);bind('wg',v=>state.policy.officialWage=v,v=>v+' / 人');bind('ot',v=>state.policy.officials.tax=v);bind('os',v=>state.policy.officials.security=v,v=>v,securityOpen);bind('ow',v=>state.policy.officials.welfare=v,v=>v,welfareOpen);bind('om',v=>state.policy.officials.military=v,v=>v,militaryOpen);bind('oe',v=>state.policy.officials.teacher=v);bind('mil',v=>state.policy.militaryRatio=v/100,v=>v+'%');document.querySelectorAll('.roleHelp').forEach(b=>b.onclick=e=>{e.preventDefault();document.getElementById(b.dataset.help).classList.toggle('hidden')});
    for(const id of ['warRate','warSupply','warEquip'])document.getElementById(id).onchange=updateWarEstimate;warFight.onclick=()=>decideWar('fight',warPlan());warSign.onclick=()=>decideWar('treaty');warSurrender.onclick=()=>decideWar('surrender');hist.onmousemove=e=>{if(state.history.length<2)return;let r=hist.getBoundingClientRect(),x=(e.clientX-r.left)*(hist.width/r.width),t=clamp((x-38)/(hist.width-54),0,1);chartView.hover=Math.round((chartView.start??state.history[0].year)+((chartView.end??state.history[state.history.length-1].year)-(chartView.start??state.history[0].year))*t);drawHist()};hist.onmouseleave=()=>{chartView.hover=null;drawHist()};hist.onwheel=e=>{if(!e.altKey||state.history.length<4)return;e.preventDefault();let first=state.history[0].year,last=state.history[state.history.length-1].year;if(chartView.start==null){chartView.start=first;chartView.end=last}let span=chartView.end-chartView.start+1,next=e.deltaY>0?Math.min(last-first+1,Math.ceil(span*1.35)):Math.max(4,Math.floor(span*.75)),center=chartView.hover??Math.round((chartView.start+chartView.end)/2),s=Math.round(center-next/2),en=s+next-1;if(s<first){s=first;en=first+next-1}if(en>last){en=last;s=last-next+1}chartView.start=s;chartView.end=en;drawHist()};
    next.onclick=nextYear;fast.onclick=fastForward;document.querySelectorAll('.preset').forEach(btn=>btn.onclick=()=>applyPreset(btn.dataset.preset));reset.onclick=()=>{if(transition.busy)return;end.classList.add('hidden');log.innerHTML='';chartView={start:null,end:null,hover:null};newGame();render()};again.onclick=reset.onclick;save.onclick=()=>{if(transition.busy)return;withCore(()=>localStorage.setItem('mini-archon-local',GameCore.game.serialize(state)));alert('已存档')};load.onclick=()=>{if(transition.busy)return;let saved=localStorage.getItem('mini-archon-local');if(!saved)return;try{loadStandaloneSave(saved);log.innerHTML='';render()}catch(error){alert('读档失败：'+error.message)}};
    render();
