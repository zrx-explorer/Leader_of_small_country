<!doctype html>
<meta charset="utf-8">
<title>experience tests running</title>
<style>body{margin:0;background:#e6dfd1;font:14px system-ui}pre{padding:10px}section{display:flex;gap:12px;padding:12px}iframe{border:0;height:760px}#web{width:900px}#local{width:390px;flex-shrink:0}</style>
<pre id="result">running</pre>
<section><iframe id="web" src="../../../apps/web/index.html"></iframe><iframe id="local" src="../../../play.html"></iframe></section>
<script>
const lines=[];
const assert=(value,message)=>{if(!value)throw new Error(message);};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const loaded=frame=>new Promise(resolve=>{frame.onload=resolve;});
Promise.all([loaded(web),loaded(local)]).then(async()=>{
  try{
    const win=web.contentWindow,doc=web.contentDocument,ctrl=win.__game;
    doc.querySelector('#tutorial-overlay')?.classList.add('hidden');
    ctrl.state.rng.chance=()=>false;
    const start=performance.now(),task=ctrl.nextYear();
    await wait(480);
    const overlay=doc.querySelector('.year-transition');
    assert(!overlay.hidden && overlay.querySelector('progress').value>0,'过渡没有显示进度');
    assert(doc.querySelector('main').inert && ctrl.state.year===1,'过渡期间没有锁定游戏');
    await task;
    const elapsed=performance.now()-start;
    assert(elapsed>=1500&&elapsed<2500,'普通年度过渡时长异常：'+elapsed);
    assert(ctrl.state.year===2&&!ctrl.transition.busy,'年度未结算或锁未释放');
    lines.push('PASS 自然年度过渡约1.6秒，包含进度、场景与交互锁定');
    const fast=ctrl.advanceToDecision();
    await wait(480);
    assert(!overlay.hidden,'快进没有过渡');
    overlay.querySelector('button').click();await fast;
    assert(ctrl.state.year===4&&!doc.getElementById('official-wage').disabled,'快进没有停在政策窗口');
    lines.push('PASS 快进整批共用一次过渡，可跳过且政策窗口恢复');
    const failure=ctrl.transition.run(()=>{throw new Error('expected test error');},{year:4});
    overlay.querySelector('button').click();
    let rejected=false;try{await failure;}catch{rejected=true;}
    assert(rejected&&!ctrl.transition.busy&&overlay.hidden&&!doc.querySelector('main').inert,'异常后界面未解锁');
    lines.push('PASS 结算异常后进度遮罩与交互锁均释放');
    const localDoc=local.contentDocument;
    assert(localDoc.documentElement.scrollWidth<=local.clientWidth+1,'手机宽度存在横向溢出');
    localDoc.getElementById('next').click();await wait(480);
    const localOverlay=localDoc.querySelector('.year-transition');
    assert(!localOverlay.hidden&&localDoc.querySelector('main').inert,'手机宽度单文件版过渡未生效');
    localOverlay.querySelector('button').click();await wait(20);
    assert(localDoc.getElementById('year').textContent==='2','单文件版跳过动画后未推进');
    lines.push('PASS 390px单文件画面无横向溢出，进度与跳过动画可用');
  }catch(error){lines.push('FAIL '+error.message);}
  const failed=lines.filter(line=>line.startsWith('FAIL')).length;
  result.textContent=lines.join('\n');document.title=failed?'experience tests failed':'experience tests passed';document.body.dataset.failed=failed;
});
</script>
