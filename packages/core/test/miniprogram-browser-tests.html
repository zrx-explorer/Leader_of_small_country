<!doctype html>
<meta charset="utf-8">
<title>miniprogram tests running</title>
<pre id="result">running</pre>
<script>
const root = new URL('../../../apps/miniprogram/core/', location.href);
const cache = {};
function load(name) {
  const key = name.replace(/^\.\//, '');
  if (cache[key]) return cache[key].exports;
  const request = new XMLHttpRequest();
  request.open('GET', new URL(key, root), false);
  request.send();
  if (request.status && request.status !== 200) throw new Error(`无法读取 ${key}`);
  const module = {exports:{}};
  cache[key] = module;
  new Function('require', 'module', 'exports', `${request.responseText}\n//# sourceURL=${key}`)(load, module, module.exports);
  return module.exports;
}

const results = [];
function assert(value, message) { if (!value) throw new Error(message); }
function test(name, fn) {
  try { fn(); results.push(`PASS ${name}`); }
  catch (error) { results.push(`FAIL ${name}: ${error.message}`); }
}

test('小程序核心可加载并生成性别', () => {
  const game = load('game.js');
  const state = game.newGame({chapter:1, seed:7});
  assert(state.people.every(p => p.gender === 'male' || p.gender === 'female'), '存在无性别人口');
});

test('小程序存档会保留待处理事件', () => {
  const game = load('game.js');
  const events = load('events.js').EVENTS;
  const state = game.newGame({chapter:1, seed:9});
  state.pendingEvent = events.find(e => e.id === 'good_harvest');
  state.morality = 5;
  state.rationality = -2;
  const restored = game.deserialize(game.serialize(state));
  assert(restored.pendingEvent && restored.pendingEvent.id === 'good_harvest', '小程序读档后待处理事件丢失');
  assert(restored.morality === 5 && restored.rationality === -2, '小程序读档后隐藏属性丢失');
});

test('小程序事件完整记录隐藏属性', () => {
  const game = load('game.js');
  const events = load('events.js').EVENTS;
  assert(events.length >= 16, `小程序事件数量只有 ${events.length}`);
  assert(events.every(e => e.options.every(o => o.hiddenEffects
    && Number.isFinite(o.hiddenEffects.morality) && o.hiddenEffects.morality !== 0
    && Number.isFinite(o.hiddenEffects.rationality) && o.hiddenEffects.rationality !== 0)), '存在未配置隐藏属性的事件选项');
  const state = game.newGame({chapter:1, seed:10});
  state.people[0].isCriminal = true;
  state.pendingEvent = events.find(e => e.id === 'criminal_sentencing');
  game.applyEventOption(state, 0);
  assert(!state.people[0].isCriminal, '小程序感化选项没有让罪犯从良');
  assert(state.morality === 3 && state.rationality === 1, '小程序隐藏属性没有结算');
});

test('小程序核心可连续推进 30 年', () => {
  const game = load('game.js');
  const state = game.newGame({chapter:4, seed:11});
  for (let i = 0; i < 30 && !state.over; i++) {
    if (state.pendingEvent) game.applyEventOption(state, 0);
    if (state.pendingWar) game.applyWarDecision(state, {action:'fight',conscriptionRate:.2,supplyLevel:2,equipmentLevel:2});
    game.nextYear(state);
    assert(state.people.length <= state.cfg.populationHardCap, '人口突破硬上限');
  }
});

test('小程序战争核心可结算并生成条约', () => {
  const game=load('game.js');
  const state=game.newGame({chapter:4,seed:77});
  state.year=21;
  state.pendingWar={enemyName:'测试敌国',enemyStrength:999,eligible:300,offeredTreaty:{duration:4,upfront:500,annualFlat:100,taxShare:.3,minTaxRate:.1}};
  const before=state.people.length;
  const result=game.applyWarDecision(state,{action:'fight',conscriptionRate:.2,supplyLevel:1,equipmentLevel:1});
  assert(result.outcome==='defeat'&&state.people.length<before,'小程序战败没有消耗人口');
  assert(state.treaty&&game.treatyTaxFloor(state)>=.1,'小程序战败条约未生效');
});

test('小程序税务官管辖上限为 100', () => {
  const {assignRoles, collectTax} = load('government.js');
  const people = Array.from({length:201}, (_, i) => ({id:i, klass:'farmer', grain:100, product:0, isCriminal:false, role:null}));
  people.push({id:999, klass:'official', grain:0, product:0, isCriminal:false, role:null});
  const policy = {tax:{farmer:.1,worker:0,merchant:0}, officials:{tax:1,security:0,welfare:0,military:0,teacher:0}};
  assignRoles(people, policy);
  assert(collectTax(people, policy, []) === 1000, '税收覆盖人数不正确');
});

test('小程序政策页可加载民生调税规则', () => {
  const request = new XMLHttpRequest();
  request.open('GET', new URL('../../../apps/miniprogram/pages/policy/policy.js', location.href), false);
  request.send();
  const state = load('game.js').newGame({chapter:4, seed:23});
  state.year = 11;
  state.people[0].role = 'welfare';
  state.lastTaxChangeYear = 1;
  let page;
  new Function('getApp', 'Page', request.responseText)(
    () => ({globalData:{state}}),
    definition => { page = definition; },
  );
  assert(page.taxInterval.call(page) === 10, '1名民生官调税间隔不是10年');
  assert(page.canAdjustTax.call(page), '满10年后税率仍锁定');
});

const failed = results.filter(line => line.startsWith('FAIL')).length;
result.textContent = results.join('\n');
document.title = failed ? `miniprogram tests failed (${failed})` : 'miniprogram tests passed';
document.body.dataset.failed = String(failed);
</script>
