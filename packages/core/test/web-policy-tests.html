<!doctype html>
<meta charset="utf-8">
<title>web policy tests running</title>
<pre id="result">running</pre>
<iframe id="game" src="../../../apps/web/index.html" hidden></iframe>
<script>
const lines = [];
function assert(value, message) { if (!value) throw new Error(message); }
game.onload = () => setTimeout(() => {
  try {
    const ctrl = game.contentWindow.__game;
    const doc = game.contentDocument;
    const state = ctrl.state;
    assert(!doc.body.innerText.includes('善恶值') && !doc.body.innerText.includes('理性值'), '隐藏属性被显示在 Web 界面');
    assert(!doc.querySelector('.advanced-policy').open, '高级调控没有默认收起');
    const initialLogBlocks = doc.getElementById('log-list').children.length;
    doc.querySelector('[data-preset="balanced"]').click();
    assert(state.policy.tax.farmer === .06 && state.policy.militaryRatio === .05 && state.policy.officialWage === 10, 'Web 快捷政策方案没有生效');
    assert(doc.getElementById('official-wage'), 'Web 缺少公务员工资调节项');
    ctrl.setOfficialWage(18);
    assert(state.policy.officialWage === 18, 'Web 无法调整公务员工资');
    assert(Object.values(state.policy.officials).reduce((a,b)=>a+b,0) <= state.stats.byClass.official, 'Web 快捷方案超配公务员');
    assert(doc.getElementById('log-list').children.length === initialLogBlocks, 'Web 快捷方案重复追加同一年度日志');
    while (state.people.length < 101) state.people.push({...state.people[0], id:1000 + state.people.length});
    state.stats.total = state.people.length;
    state.year = 11;
    state.people.forEach(p => { if (p.role === 'welfare') p.role = null; });
    assert(!ctrl.canAdjustTax(), '人口过百且无民生官时仍可调税');
    state.people[0].role = 'welfare';
    assert(ctrl.taxInterval() === 10 && ctrl.canAdjustTax(), '1名民生官应每10年调税');
    ctrl.setTax('farmer', .12);
    assert(state.lastTaxChangeYear === 11, '调税年份没有记录');
    state.year = 20;
    assert(!ctrl.canAdjustTax(), '冷却未满10年时可调税');
    state.year = 21;
    assert(ctrl.canAdjustTax(), '冷却满10年后仍不可调税');
    for (let i = 1; i < 11; i++) state.people[i].role = 'welfare';
    assert(ctrl.taxInterval() === 1, '11名民生官应每年调税');
    lines.push('PASS 民生官员税率冷却规则');

    state.year = 10;
    state.policy.officials.welfare = 0;
    ctrl.setOfficial('welfare', 3);
    assert(state.policy.officials.welfare === 0, '第10年提前解锁民生官员');
    state.year = 13;
    ctrl.setOfficial('welfare', 3);
    assert(state.policy.officials.welfare === 3, '解锁后无法调整民生官员');
    state.year = 19;
    state.policy.officials.military = 0;
    ctrl.setOfficial('military', 3);
    assert(state.policy.officials.military === 0, '经营未满20年时提前解锁军事官员');
    state.year = 22;
    ctrl.setOfficial('military', 3);
    assert(state.policy.officials.military === 3, '解锁后无法调整军事官员');
    lines.push('PASS Web岗位解锁限制');
    lines.push('PASS 隐藏属性未显示在 Web 界面');

    ctrl.restart();
    ctrl.state.year = 2;
    ctrl.state.rng.chance = () => false;
    doc.getElementById('btn-fast').click();
    assert(ctrl.state.year === 4, `推进至决策停在第${ctrl.state.year}年`);
    assert(doc.getElementById('year-summary').textContent.includes('变化'), 'Web 没有显示年度变化摘要');
    lines.push('PASS 快捷政策、工资调节、年度摘要与推进至决策');
  } catch (error) {
    lines.push(`FAIL ${error.message}`);
  }
  const failed = lines.filter(x => x.startsWith('FAIL')).length;
  result.textContent = lines.join('\n');
  document.title = failed ? `web policy tests failed (${failed})` : 'web policy tests passed';
  document.body.dataset.failed = String(failed);
}, 100);
</script>
