const results = [];
function test(name, fn) {
  try { fn(); results.push(`PASS ${name}`); }
  catch (error) { results.push(`FAIL ${name}: ${error.message}`); }
}
function assert(value, message) { if (!value) throw new Error(message); }

test('存档会保留待处理事件', () => {
  const state = newGame({chapter:1, seed:5});
  state.pendingEvent = EVENTS.find(e => e.id === 'good_harvest');
  state.morality = 7;
  state.rationality = -4;
  const restored = deserialize(serialize(state));
  assert(restored.pendingEvent?.id === 'good_harvest', '读档后待处理事件丢失');
  assert(restored.morality === 7 && restored.rationality === -4, '读档后隐藏属性丢失');
});

test('旧存档缺少隐藏属性时会补零', () => {
  const archived = JSON.parse(serialize(newGame({chapter:1, seed:6})));
  delete archived.morality;
  delete archived.rationality;
  const restored = deserialize(JSON.stringify(archived));
  assert(restored.morality === 0 && restored.rationality === 0, '旧存档隐藏属性没有补零');
});

test('旧存档缺少公务员工资时会补默认值', () => {
  const archived = JSON.parse(serialize(newGame({chapter:1, seed:60})));
  delete archived.policy.officialWage;
  const restored = deserialize(JSON.stringify(archived));
  assert(restored.policy.officialWage === DEFAULT_CONFIG.govWage, '旧存档没有补公务员工资');
});

test('快捷政策方案会守住公务员容量与条约税率下限', () => {
  const state = newGame({chapter:1, seed:61});
  const available = state.stats.byClass.official;
  const result = applyPolicyPreset(state, 'wellbeing');
  assert(result.label === '休养生息', '没有应用指定政策方案');
  assert(Object.values(state.policy.officials).reduce((a,b)=>a+b,0) <= available, '快捷方案超配公务员');
  assert(state.policy.officials.security > 0, '快捷方案没有为第5年治安解锁预留人员');
  assert(state.policy.tax.farmer === .03 && state.policy.militaryRatio === .02, '休养生息数值不正确');
  state.treaty = {minTaxRate:.12};
  applyPolicyPreset(state, 'wellbeing');
  assert(Object.values(state.policy.tax).every(v => v >= .12), '快捷方案突破条约税率下限');
  const taxes = {...state.policy.tax};
  applyPolicyPreset(state, 'defense', {includeTax:false});
  assert(JSON.stringify(state.policy.tax) === JSON.stringify(taxes), '税率冷却时快捷方案仍修改税率');
});

test('事件抽取会避开最近两次事件', () => {
  const state = newGame({chapter:1, seed:62});
  state.year = 8;
  state.stats.avgIntelligence = 60;
  state.rng.chance = () => true;
  state.rng.uniform = () => 0;
  const ids = [rollEvent(state).id, rollEvent(state).id, rollEvent(state).id];
  assert(new Set(ids).size === 3, `连续抽到重复事件：${ids.join(',')}`);
  assert(state.recentEventIds.join(',') === ids.slice(-2).join(','), '最近事件记录不正确');
});

test('年度变化摘要和日志会随存档保留', () => {
  const state = newGame({chapter:1, seed:63});
  nextYear(state);
  assert(state.lastYearChanges?.year === 1, '没有生成年变化摘要');
  const restored = deserialize(serialize(state));
  assert(restored.lastYearChanges?.year === 1, '读档后年变化摘要丢失');
  assert(restored.log[0] === state.log[0], '读档后当前年度日志丢失');
  assert(restored.recentEventIds.join(',') === state.recentEventIds.join(','), '读档后最近事件记录丢失');
});

test('每个事件选项都会影响善恶值与理性值', () => {
  assert(EVENTS.length >= 16, `事件数量只有 ${EVENTS.length}`);
  for (const event of EVENTS) {
    for (const option of event.options) {
      const effects = option.hiddenEffects;
      assert(option.tradeoffs?.benefit && option.tradeoffs?.cost,
        `${event.id} / ${option.label} 没有同时声明收益与代价`);
      assert(effects && Number.isFinite(effects.morality) && effects.morality !== 0,
        `${event.id} / ${option.label} 缺少善恶值变化`);
      assert(effects && Number.isFinite(effects.rationality) && effects.rationality !== 0,
        `${event.id} / ${option.label} 缺少理性值变化`);
    }
  }
});

test('生产下限是单人需求的13倍且不压低更高产量', () => {
  const rng = { uniform:()=>0 };
  const farmer = basePerson(501, {klass:CLASS.FARMER, grain:0, intelligence:50});
  farmersProduce([farmer], {...DEFAULT_CONFIG, farmerProdMean:10, farmerProdJitter:0}, rng);
  assert(farmer.grain === DEFAULT_CONFIG.grainNeed * 13, `农民产粮 ${farmer.grain}`);
  const productiveFarmer = basePerson(502, {klass:CLASS.FARMER, grain:0, intelligence:50});
  farmersProduce([productiveFarmer], {...DEFAULT_CONFIG, farmerProdMean:2000, farmerProdJitter:0}, rng);
  assert(productiveFarmer.grain === 200, '高于下限的农民产量被改写');

  const worker = basePerson(503, {klass:CLASS.WORKER, grain:100, product:0, intelligence:50});
  workersProduce([worker], {...DEFAULT_CONFIG, workerProdMean:5, workerProdJitter:0}, rng);
  assert(worker.product === DEFAULT_CONFIG.productNeedBase * 13, `工人产品 ${worker.product}`);
  const productiveWorker = basePerson(504, {klass:CLASS.WORKER, grain:100, product:0, intelligence:50});
  workersProduce([productiveWorker], {...DEFAULT_CONFIG, workerProdMean:100, workerProdJitter:0}, rng);
  assert(productiveWorker.product === 20, '高于下限的工人产量被改写');
});

test('商人按策划顺序进货并优先赚取价差', () => {
  const worker = basePerson(511, {klass:CLASS.WORKER, grain:0, product:30});
  const merchant = basePerson(512, {klass:CLASS.MERCHANT, grain:60, product:0});
  const farmer = basePerson(513, {klass:CLASS.FARMER, grain:100, product:0, satisfaction:12});

  assert(merchant.grain > 60, `商人没有赚到价差，粮食 ${merchant.grain}`);
});

test('上访与罪犯事件会结算玩法结果和隐藏属性', () => {
  const petitionState = newGame({chapter:1, seed:7});
  petitionState.pendingEvent = EVENTS.find(e => e.id === 'farmer_petition');
  const farmer = petitionState.people.find(p => p.klass === 'farmer');
  const farmerGrain = farmer.grain;
  applyEventOption(petitionState, 0);
  assert(farmer.grain === farmerGrain + 5, '彻查豪强后没有退还田粮');
  assert(petitionState.morality === 3 && petitionState.rationality === 2, '上访选项隐藏属性未结算');

  const criminalState = newGame({chapter:1, seed:8});
  criminalState.people[0].isCriminal = true;
  criminalState.pendingEvent = EVENTS.find(e => e.id === 'criminal_sentencing');
  applyEventOption(criminalState, 0);
  assert(!criminalState.people[0].isCriminal, '感化后罪犯没有从良');
  assert(criminalState.morality === 3 && criminalState.rationality === 1, '感化选项隐藏属性未结算');

  const executionState = newGame({chapter:1, seed:9});
  executionState.people[0].isCriminal = true;
  const beforePopulation = executionState.people.length;
  executionState.pendingEvent = EVENTS.find(e => e.id === 'criminal_sentencing');
  applyEventOption(executionState, 1);
  assert(executionState.people.length === beforePopulation - 1, '处决后没有移除罪犯');
  assert(executionState.morality === -3 && executionState.rationality === -1, '处决选项隐藏属性未结算');
});

test('贪官、商人和灾民事件会真实改变人口结构', () => {
  const corrupt = newGame({chapter:1, seed:81});
  const officialsBefore = corrupt.stats.byClass.official;
  corrupt.pendingEvent = EVENTS.find(e => e.id === 'corrupt_official');
  applyEventOption(corrupt, 0);
  assert(corrupt.stats.byClass.official === officialsBefore - 1, '查办贪官没有减少公务员人口');
  assert(corrupt.flags.corruptionCaseYear === corrupt.year, '没有记录贪腐后续事件钩子');
  corrupt.year += 2;
  assert(EVENTS.find(e => e.id === 'corruption_aftershock').condition(corrupt), '两年后没有开放贪腐余波事件');

  const inflation = newGame({chapter:1, seed:82});
  const merchantsBefore = inflation.stats.byClass.merchant;
  inflation.pendingEvent = EVENTS.find(e => e.id === 'inflation');
  applyEventOption(inflation, 0);
  assert(inflation.stats.byClass.merchant === merchantsBefore - 1, '惩办商人没有减少商人人口');
  assert(inflation.flags.merchantPunishedYear === inflation.year, '没有记录商路后续事件钩子');
  inflation.year += 2;
  assert(EVENTS.find(e => e.id === 'merchant_backlash').condition(inflation), '两年后没有开放商路萧条事件');

  const refugees = newGame({chapter:1, seed:83});
  refugees.year = 7;
  const populationBefore = refugees.people.length;
  refugees.pendingEvent = EVENTS.find(e => e.id === 'refugees_at_gate');
  applyEventOption(refugees, 0);
  const newcomers = refugees.people.filter(p => p.refugeeWave === 7);
  assert(refugees.people.length > populationBefore && newcomers.length >= 3, '接纳灾民没有增加人口');
  assert(newcomers.every(p => p.satisfaction === -12 && !p.isCriminal), '灾民没有以低满意、非罪犯状态加入');
  const maxId = Math.max(...refugees.people.map(p => p.id));
  assert(createPerson(refugees.rng, CLASS.FARMER).id > maxId, '事件新增人口后出生编号发生冲突');
  refugees.year += 2;
  assert(EVENTS.find(e => e.id === 'refugee_integration').condition(refugees), '两年后没有开放新民安置事件');
});
function basePerson(id, overrides = {}) {
  return { id, name:`民${id}`, klass:CLASS.FARMER, age:25, gender:'male', intelligence:50,
    satisfaction:0, grain:100, product:0, isCriminal:false, isInflated:false, role:null, history:[], ...overrides };
}

test('民生与军事岗位按经营年限解锁', () => {
  const officials = Array.from({length:8}, (_, i) => basePerson(i + 1, {klass:CLASS.OFFICIAL}));
  const policy = {officials:{tax:0,security:1,welfare:2,military:2,teacher:0}};
  assignRoles(officials, policy, 10);
  assert(!officials.some(p => p.role === 'welfare' || p.role === 'military'), '第10年提前分配锁定岗位');
  assignRoles(officials, policy, 11);
  assert(officials.filter(p => p.role === 'welfare').length === 2, '第11年未解锁民生岗位');
  assert(!officials.some(p => p.role === 'military'), '第11年提前解锁军事岗位');
  assignRoles(officials, policy, 21);
  assert(officials.filter(p => p.role === 'military').length === 2, '第21年未解锁军事岗位');
});

test('前五年无罪犯，之后高低满意度均可能犯罪', () => {
  const people = [basePerson(1, {satisfaction:-30}), basePerson(2, {satisfaction:30})];
  const always = { chance:()=>true };
  judgeStatus(people, always, DEFAULT_CONFIG, 5, []);
  assert(people.every(p => !p.isCriminal), '第 5 年出现罪犯');
  judgeStatus(people, always, DEFAULT_CONFIG, 6, []);
  assert(people.every(p => p.isCriminal), '高低满意度没有都产生罪犯');
  assert(aggregate(people).avgSatisfaction === 0, '罪犯满意度被计入平均值');
});

test('犯罪阈值校准为低于 -10 / 高于 24', () => {
  const rng = new RNG(11024);
  const low = Array.from({length:5000}, (_, i) => basePerson(i + 1, {satisfaction:-15}));
  const high = Array.from({length:5000}, (_, i) => basePerson(i + 6000, {satisfaction:27}));
  judgeStatus(low, rng, DEFAULT_CONFIG, 6, []);
  judgeStatus(high, rng, DEFAULT_CONFIG, 6, []);
  const lowRate = low.filter(p => p.isCriminal).length / low.length;
  const highRate = high.filter(p => p.isCriminal).length / high.length;
  assert(lowRate > .19 && lowRate < .25, `低满意度犯罪率 ${(lowRate*100).toFixed(1)}%`);
  assert(highRate > .045 && highRate < .09, `高满意度犯罪率 ${(highRate*100).toFixed(1)}%`);
});

test('战争策略数值校准稳定', () => {
  const strategies = [
    {name:'低投入',plan:{action:'fight',conscriptionRate:.1,supplyLevel:1,equipmentLevel:1}},
    {name:'标准',plan:{action:'fight',conscriptionRate:.2,supplyLevel:2,equipmentLevel:2}},
    {name:'高投入',plan:{action:'fight',conscriptionRate:.3,supplyLevel:3,equipmentLevel:3}},
  ];
  for (const strategy of strategies) {
    let wins=0,totalCost=0,totalLoss=0;
    for (let seed=1;seed<=120;seed++) {
      const state=newGame({chapter:4,seed:1000+seed});
      state.year=21; state.treasury=30000;
      const eligible=state.people.filter(p=>!p.isCriminal&&p.age>=18&&p.age<=50).length;
      state.pendingWar={enemyName:'校准敌国',enemyStrength:Math.round(eligible*(.18+(seed%38)/100)),eligible,offeredTreaty:{duration:4,upfront:500,annualFlat:100,taxShare:.25,minTaxRate:.1}};
      const before=state.people.length;
      const result=applyWarDecision(state,strategy.plan);
      if(result.outcome!=='defeat')wins++;
      totalCost+=result.cost; totalLoss+=before-state.people.length;
    }
    const winRate=wins/120,avgCost=totalCost/120,avgLoss=totalLoss/120;
    results.push(`INFO ${strategy.name}：胜率${(winRate*100).toFixed(0)}%，平均军费${avgCost.toFixed(0)}，平均死亡${avgLoss.toFixed(1)}`);
    if(strategy.name==='低投入') assert(winRate<.45,'低投入胜率过高');
    if(strategy.name==='标准') assert(winRate>.65&&winRate<1,'标准投入胜率失衡');
    if(strategy.name==='高投入') assert(winRate>.9,'高投入胜率过低');
    assert(avgCost>0&&avgLoss>0,'战争没有形成资源消耗');
  }
});

test('长程人口不会突破硬上限', () => {
  let maxPopulation = 0;
  for (let seed = 1; seed <= 8; seed++) {
    const state = newGame({chapter:4, seed});
    let years = 0;
    for (; years < 120 && !state.over; years++) {
      if (state.pendingEvent) applyEventOption(state, 0);
      if (state.pendingWar) applyWarDecision(state, {action:'fight',conscriptionRate:.2,supplyLevel:2,equipmentLevel:2});
      nextYear(state);
      maxPopulation = Math.max(maxPopulation, state.stats.total);
      assert(state.stats.total <= state.cfg.populationHardCap, `人口达到 ${state.stats.total}`);
    }
  }
  results.push(`INFO 长程模拟最大人口 ${maxPopulation}`);
});

const failed = results.filter(line => line.startsWith('FAIL')).length;
document.getElementById('result').textContent = results.join('\n');
document.title = failed ? `core tests failed (${failed})` : 'core tests passed';
document.body.dataset.failed = String(failed);
</script>
